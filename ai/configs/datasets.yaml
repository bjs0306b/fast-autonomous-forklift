# 화물 인식 데이터셋 구성 (FR-101)
# 경로는 ai/ 디렉터리 기준 상대경로.

# 클래스 정의 — 선언 순서대로 category_id 1, 2, ... 가 붙는다.
#
# 박스와 파렛트를 나누는 이유: 측정 스테이션에는 파렛트 위에 박스가 올라간 상태로
# 들어오는데, 한 클래스로 합치면 어느 검출을 측정할지 알 수 없다. 공개 데이터셋이
# 원래 둘을 따로 라벨링해 두었으므로 그 구분을 살린다.
classes: [box, pallet]

output: data/processed/box_coco.json

# 소스 선언 순서 = 중복 시 우선순위. 공개 데이터셋은 서로를 재수록하므로
# (실측: LOCO 5,097장 중 3,830장이 Logistics에 재수록됨) 같은 원본 사진은
# 먼저 선언된 group이 가져간다. LOCO를 맨 앞에 두는 이유:
#   - 수동 라벨 원본이다
#   - small_load_carrier / stillage / pallet 구분이 살아 있어, 나중에 채택
#     기준을 바꿀 여지가 남는다 (Logistics는 이를 wood pallet으로 뭉갰다)
# group이 같으면 중복으로 보지 않는다 — 증강본은 원본을 공유하기 때문이다.
sources:
  # LOCO — 물류 창고 특화, COCO 포맷, 무료
  # 실제 카테고리: small_load_carrier(3), forklift(5), pallet(7), stillage(10), pallet_truck(11)
  # 이 중 '적재 대상'만 채택한다. forklift/pallet_truck은 장비라 제외.
  # pallet은 받침대지만 포크를 꽂는 대상이라 인식이 필요해 포함한다(FR-303 연계).
  #
  # file_name이 '1583416214257,48.jpg' 같은 타임스탬프 basename이라 subset을 합치면
  # 충돌한다. 디렉터리가 담긴 path를 쓰고 공통 접두사 '/dataset/'만 떼어낸다.
  - name: loco
    group: loco
    type: coco
    enabled: true
    # dataset.zip을 data/raw/loco/에 풀면 dataset/subset-N/... 구조가 나온다.
    annotations: data/raw/loco/loco-all-v1.json
    images_root: data/raw/loco/dataset
    class_map:
      box: [small_load_carrier, stillage]
      pallet: [pallet]
      # forklift, pallet_truck은 장비라 나열하지 않는다 → 자동 제외
    path_key: path
    strip_path_prefix: /dataset/

  # Roboflow Universe "Carboard Box" v4 (CC BY 4.0, 원본 ~1.1k장을 증강해 10,393장).
  # Roboflow는 train/valid/test로 나눠 내보내므로 셋 다 읽어 합친다.
  # (분할은 FR-101-2에서 우리 기준으로 다시 하므로 여기선 원본 분할을 무시한다.)
  #
  # 카테고리가 4개인데 실물을 확인한 결과 전부 종이박스였다:
  #   Cardboard-Box(id 0) — Roboflow 더미, 어노테이션 0개
  #   '0', 'box'          — 같은 대상. 하위 데이터셋 병합 중 이름만 갈라짐
  #   snake-in-cardboard-boxes — 박스에 숨는 밈 사진. bbox는 박스에 있음(71개)
  # 따라서 '*'로 전체를 box에 매핑한다. 이 소스에는 파렛트가 없다.
  #
  # 주의: 증강본이라 file_name이 '<원본>_jpg.rf.<해시>.jpg' 형태다. FR-101-2에서
  # 분할할 때 '_jpg.rf.' 앞부분으로 묶지 않으면 같은 원본이 train/val에 갈라져
  # 성능이 부풀려진다.
  # 없는 split은 자동으로 건너뛴다.
  - name: roboflow_cardboard_train
    group: roboflow_cardboard
    type: coco
    enabled: true
    prefix: roboflow_cardboard
    annotations: data/raw/roboflow_cardboard/train/_annotations.coco.json
    images_root: data/raw/roboflow_cardboard/train
    class_map:
      box: "*"      # 4개 카테고리 전부 종이박스 (실물 확인)

  - name: roboflow_cardboard_valid
    group: roboflow_cardboard
    type: coco
    enabled: true
    prefix: roboflow_cardboard_valid
    annotations: data/raw/roboflow_cardboard/valid/_annotations.coco.json
    images_root: data/raw/roboflow_cardboard/valid
    class_map:
      box: "*"

  - name: roboflow_cardboard_test
    group: roboflow_cardboard
    type: coco
    enabled: true
    prefix: roboflow_cardboard_test
    annotations: data/raw/roboflow_cardboard/test/_annotations.coco.json
    images_root: data/raw/roboflow_cardboard/test
    class_map:
      box: "*"

  # Roboflow Universe "Logistics" v2 (CC BY 4.0, 99,238장, 640x640 stretch 리사이즈).
  # 창고에서 지게차가 화물을 다루는 장면. 21개 클래스 중 적재 대상만 채택하고
  # 장비(forklift, pallet truck)·사람·차량·안전장구는 제외한다.
  #
  # 주의: 설명에 따르면 일부가 Autodistill DETIC으로 자동 라벨링됐다.
  # 베이스 모델 mAP도 76% 수준이라 라벨 노이즈를 전제하고 FR-101-2에서 검수한다.
  - name: logistics_train
    group: logistics
    type: coco
    enabled: true
    prefix: logistics
    annotations: data/raw/logistics/train/_annotations.coco.json
    images_root: data/raw/logistics/train
    class_map:
      box: ["cardboard box"]
      pallet: ["wood pallet"]

  - name: logistics_valid
    group: logistics
    type: coco
    enabled: true
    prefix: logistics_valid
    annotations: data/raw/logistics/valid/_annotations.coco.json
    images_root: data/raw/logistics/valid
    class_map:
      box: ["cardboard box"]
      pallet: ["wood pallet"]

  - name: logistics_test
    group: logistics
    type: coco
    enabled: true
    prefix: logistics_test
    annotations: data/raw/logistics/test/_annotations.coco.json
    images_root: data/raw/logistics/test
    class_map:
      box: ["cardboard box"]
      pallet: ["wood pallet"]

  # 리그 촬영본 (2026-07-24, 자체 촬영 301장) — 검은 플라스틱 파렛트 도메인.
  # 공개 데이터셋은 목재 파렛트 위주라 우리 리그의 검은 파렛트를 전혀 못 잡는다
  # (실측: 임계 0.02에서도 후보 0건). 이 소스가 그 갭을 메운다.
  #
  # 라벨 출처: 박스 = 현 모델 프리라벨(dataset.prelabel), 파렛트 = 고전 CV 자동
  # 라벨(dataset.pallet_autolabel) + 사람 보정. 미처리분은 data/processed/rig_review.md.
  #
  # ⚠️ 파렛트가 없는 네거티브 16장(0121~0136)은 convert가 '어노테이션 없는 이미지'로
  # 버린다. 살리려면 --keep-empty가 필요한데 그건 전 소스에 걸리므로, 네거티브는
  # 학습 직전에 서버에서 따로 합친다 (runbook 참고).
  - name: rig_20260724
    group: rig
    type: coco
    enabled: true
    prefix: rig
    annotations: data/processed/rig_labeled.json
    images_root: data/raw/rig/20260724
    class_map:
      box: [box]
      pallet: [pallet]

  # astraws "Pallet Detection" (Roboflow, CC BY 4.0, 원본 367장 → 증강 879장).
  # **플라스틱 파렛트를 별도 클래스로 라벨링한 유일한 공개 소스** — plastic pallet 808 +
  # wood pallet 532. 2026-07-24 리그의 검은 플라스틱 파렛트 미검출(도메인 갭) 보강용.
  # 뷰는 창고 비스듬한 시점 위주라 우리 "바닥 정면 27cm" 뷰와는 다름 — 재질 다양성
  # 공급이 목적이고, 뷰 갭 해소는 rig 자체 촬영분이 담당한다. 박스 클래스는 없다.
  - name: astraws_pallet_train
    group: astraws_pallet
    type: coco
    enabled: true
    prefix: astraws
    annotations: data/raw/astraws_pallet/train/_annotations.coco.json
    images_root: data/raw/astraws_pallet/train
    class_map:
      pallet: ["plastic pallet", "wood pallet"]

  - name: astraws_pallet_valid
    group: astraws_pallet
    type: coco
    enabled: true
    prefix: astraws_valid
    annotations: data/raw/astraws_pallet/valid/_annotations.coco.json
    images_root: data/raw/astraws_pallet/valid
    class_map:
      pallet: ["plastic pallet", "wood pallet"]

  - name: astraws_pallet_test
    group: astraws_pallet
    type: coco
    enabled: true
    prefix: astraws_test
    annotations: data/raw/astraws_pallet/test/_annotations.coco.json
    images_root: data/raw/astraws_pallet/test
    class_map:
      pallet: ["plastic pallet", "wood pallet"]

  # SKU-110K — 밀집 적재 장면. 학술·비영리 라이선스라 기본 비활성.
  # 사용 여부는 팀 합의 후 결정한다 (README 라이선스 항목 참고).
  - name: sku110k
    type: sku110k
    enabled: false
    annotations: data/raw/SKU110K/annotations/annotations_train.csv
    images_root: data/raw/SKU110K/images
