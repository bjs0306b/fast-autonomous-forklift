# 화물 크기 등급 정의 (FR-102)
#
# ⚠️ 아래 치수는 **임시 기본값**이다.
#    명세 2.1은 "실제 화물 3개 + 미니어처 화물 3개를 준비한다"고만 하고 규격을
#    정하지 않았다. 팀이 실물 3종을 확정하면 이 파일의 dimensions_cm을 실측값으로
#    교체한다. 코드 수정은 필요 없다.
#
# 기본값 근거: 우체국 택배 박스 표준 규격 중 **서로 구분이 잘 되는 조합**.
#
# 크기만 보고 1·2·3호처럼 연속된 호수를 고르면 안 된다. 박스는 세 면 중 어느
# 것이 보일지 모르는데, 호수가 인접하면 서로 다른 등급의 면 치수가 겹친다.
# 실제로 1/2/3호는 구분 여유가 12%밖에 안 돼 측정 오차 12%에서 오판이 시작된다.
#
# 후보 20개 조합을 전수 비교한 결과 2호 / 2-1호 / 5호가 26.5%로 가장 여유롭다.
# 2-1호가 납작한 형태(35×25×10)라 나머지 둘과 확실히 갈린다.
#
# 조합을 바꾸면 반드시 검증한다:
#     python -m perception.size_grade --config configs/cargo.yaml

# 관측 치수와 등급 치수의 최대 상대 오차 허용치.
# 이 값을 넘으면 어느 등급에도 넣지 않고 미지로 둔다.
# 0.2 = 20%. ToF 거리 오차와 bbox 경계 오차가 함께 실리므로 넉넉히 잡았다.
# 현재 조합의 구분 여유가 26.5%라 20%까지는 안전하다. 실측 후 조정한다.
tolerance: 0.2

grades:
  - name: S
    label: 소형
    dimensions_cm: [27, 18, 15]     # 택배 2호
    miniature: mini_box_s

  - name: M
    label: 중형
    dimensions_cm: [35, 25, 10]     # 택배 2-1호 (납작형)
    miniature: mini_box_m

  - name: L
    label: 대형
    dimensions_cm: [48, 38, 34]     # 택배 5호
    miniature: mini_box_l

# 카메라 내부 파라미터 (FR-101-5 Jetson 배포 시 캘리브레이션 값으로 교체)
# 지금은 화각 기반 근사값이라 정확도가 낮다.
camera:
  width: 1280
  height: 720
  hfov_deg: 70
