spring:
  datasource:
    url: jdbc:h2:mem:fast_backend_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fast.backend
  configuration:
    map-underscore-to-camel-case: true

mqtt:
  enabled: false
  ssl-hostname-verification-enabled: false
  test-api:
    enabled: false
  broker-url: tcp://localhost:1883
  username:
  password:
  inbound-client-id: fast-backend-test-inbound
  outbound-client-id: fast-backend-test-outbound
  connection-timeout: 10
  keep-alive-interval: 30
  automatic-reconnect: true
  clean-session: true
  default-qos: 1
  completion-timeout: 5000
  recovery-interval: 5000
  topics:
    forklift-status: forklift/+/status
    forklift-location: forklift/+/location
    forklift-path: forklift/+/path
    forklift-command-result: forklift/+/command-result
    station-measure-request: fast/station/measure_request
    forklift-command: forklift/%s/command
    isaac-telemetry: fast/v1/vehicle/+/telemetry
    isaac-event: fast/v1/vehicle/+/event
    forklift-arrived: forklift/+/arrived

vehicle:
  auto-registration-enabled: false
  offline-check-enabled: false
  offline-timeout-seconds: 10
  # 외부 시스템 차량 ID → DB vehicle_id 별칭. 현재 Isaac Sim 은 sim02/sim03 로 발행한다.
  # 키 비교는 대소문자를 무시한다. DB 의 vehicle_id 를 바꾸지 않고 백엔드 경계에서만 정규화한다.
  id-aliases:
    sim01: SIM-F01
    sim02: SIM-F02
    sim03: SIM-F03
  status-test-api:
    enabled: false

websocket:
  allowed-origin-patterns: "*"

transport:
  scheduling:
    enabled: false

cargo:
  intake:
    auto-create-enabled: false
    next-delay-ms: 5000
