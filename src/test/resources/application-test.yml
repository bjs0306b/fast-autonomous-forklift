# 테스트 전용 프로필.
# 기본 mvn test가 실제 MQTT Broker에 연결하지 않도록 mqtt.enabled를 false로 둔다.
# MqttConfig의 broker 연결 Bean(Client Factory/Inbound Adapter/Outbound Handler)이 생성되지 않아,
# @SpringBootTest 컨텍스트가 여러 개 뜰 때 같은 MQTT Client ID로 실제 Broker에
# 동시 접속하면서 발생하던 "Lost connection" 로그(answer5.md/answer7.md 참고)를 없앤다.
# @ServiceActivator가 참조하는 이름의 내부 channel은 Spring Integration이 자동 생성할 수 있지만,
# Paho 연결 Bean이 없으므로 외부 broker 접속은 발생하지 않는다.
#
# MQTT 관련 순수 단위 테스트(MqttTopicsTest, MqttMessageRouterTest, MqttPublisherTest)는
# @SpringBootTest를 쓰지 않아 이 프로필과 무관하게 항상 동작한다.
#
# mqtt.enabled가 false라도 MqttTopics/MqttMessageRouter/MqttMessageReceiver Bean 자체는
# (실제 연결을 하지 않을 뿐) 계속 생성되므로, MqttProperties가 정상적으로 바인딩되도록
# topics 등 나머지 값은 application-local.yml과 동일하게 채워둔다. 이 값들은 실제로
# Broker에 접속하는 데 쓰이지 않는다.
mqtt:
  enabled: false
  test-api:
    enabled: false
  broker-url: tcp://localhost:1883
  username:
  password:
  inbound-client-id: fast-backend-test-inbound
  outbound-client-id: fast-backend-test-outbound
  connection-timeout: 10
  keep-alive-interval: 30
  automatic-reconnect: true
  clean-session: true
  default-qos: 1
  completion-timeout: 5000
  recovery-interval: 5000
  topics:
    forklift-status: forklift/+/status
    forklift-location: forklift/+/location
    forklift-path: forklift/+/path
    forklift-command-result: forklift/+/command-result
    forklift-fork-status: forklift/+/fork-status
    forklift-error: forklift/+/error
    cargo-detected: cargo/detected
    # 이동·포크·적재·비상정지 모든 명령이 쓰는 단일 발행 토픽(prompt32.md 1장 7번 확정).
    # 구 forklift-emergency 전용 토픽은 사용처가 없어 제거했다.
    forklift-command: forklift/%s/command
    station-measurement: fast/station/+/measurement

# FR-501-1: 실제 MySQL 대신 임베디드 H2(MySQL 호환 모드)를 사용한다. mvnw test가 외부 인프라(EC2/로컬
# MySQL) 없이도 완전히 자체 완결적으로 동작해야 하고, db/schema.sql이 실제로 실행 가능한지도 매 테스트
# 실행마다 검증하기 위함이다(answer15.md 14장 "테스트 결과" 참고). data-locations는 설정하지 않는다 —
# 테스트 픽스처는 각 테스트가 필요한 데이터를 직접 삽입해 테스트 간 독립성을 유지한다.
spring:
  datasource:
    url: jdbc:h2:mem:fast_backend_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fast.backend.vehicle.domain
  configuration:
    map-underscore-to-camel-case: true

vehicle:
  auto-registration-enabled: false
  offline-check-enabled: false
  offline-timeout-seconds: 10
  status-test-api:
    enabled: false

websocket:
  allowed-origin-patterns: "*"
