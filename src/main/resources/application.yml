spring:
  application:
    name: fast-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: always
    deserialization:
      adjust-dates-to-context-time-zone: false
  spring:
    datasource:
      url: "jdbc:mysql://localhost:3306/fast_backend?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      username: fastbackend
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${SERVER_PORT:8080}

storage:
  placement:
    # 단위는 m이며 화물 높이에는 팔레트 높이를 포함하지 않는다.
    #
    # ⚠️ 값이 1/10 이다. 이 창고는 **모형**이고 AI 측정 카메라가 재는 것도 그 모형 박스다
    #    (0층 칸 높이가 실측 0.14 m 다). 팔레트 0.12·여유 0.25 는 실물 T-11 기준이라,
    #    그대로 두면 required 가 0.37 m 라 어떤 칸에도 안 들어간다. 세 값이 같은 자에서
    #    비교되도록 모형 스케일로 통일했다(2026-08-10).
    #    실물 크기 창고로 가면 0.25 / 0.12 로 되돌릴 것.
    height-clearance: ${STORAGE_PLACEMENT_HEIGHT_CLEARANCE:0.025}
    pallet-height-m: ${STORAGE_PLACEMENT_PALLET_HEIGHT_M:0.012}
    max-overhang-ratio-exclusive: ${STORAGE_PLACEMENT_MAX_OVERHANG_RATIO_EXCLUSIVE:0.05}

station:
  move:
    ttl-seconds: ${STATION_MOVE_TTL_SECONDS:300}
  measurement-request:
    dispatch-interval-ms: ${STATION_MEASUREMENT_REQUEST_DISPATCH_INTERVAL_MS:1000}
  session:
    ttl-seconds: ${STATION_SESSION_TTL_SECONDS:60}
    cleanup-interval-ms: ${STATION_SESSION_CLEANUP_INTERVAL_MS:5000}

transport:
  scheduling:
    enabled: ${TRANSPORT_SCHEDULING_ENABLED:true}
    interval-ms: ${TRANSPORT_SCHEDULING_INTERVAL_MS:1000}

cargo:
  intake:
    # 정상 측정 완료 후 다음 화물과 PENDING 작업을 자동 생성한다.
    auto-create-enabled: ${CARGO_INTAKE_AUTO_CREATE_ENABLED:true}
    next-delay-ms: ${CARGO_INTAKE_NEXT_DELAY_MS:5000}

# =============================================================================
# 차량 경로 충돌 예측 및 안전거리 제어 (FR-502-1a)
# =============================================================================
# 관제가 스스로 차량에 STOP/RESUME 을 내는 유일한 기능이다.
#
# ⚠️ 기본값은 반드시 false 로 둔다 — 설정을 건드리지 않은 환경에서 저절로 차량이 멈추거나
#    움직이면 안 된다.
# ⚠️ traffic.vehicles 가 비어 있으면 어떤 차량에도 명령을 보내지 않는다. 실물 차량은
#    "명령이 끊기면 스스로 정지"하는 워치독이 확인되기 전까지 넣지 말 것.
#    시뮬 검증 예: TRAFFIC_VEHICLES=SIM-F01,SIM-F02
traffic:
  enabled: ${TRAFFIC_ENABLED:false}
  tick-ms: ${TRAFFIC_TICK_MS:500}
  vehicles: ${TRAFFIC_VEHICLES:}
  # 교통 판단에서 **통째로 빼는** 차량. 위 vehicles 와 방향이 다르다 — 그쪽은 "명령을 보낼
  # 대상"이고 이쪽은 "다른 차량이 볼 대상"이다.
  #
  # ⚠️ 여기 넣은 차량은 **아무도 피하지 않는다.** 좌표계만 겹치고 물리적으로 다른 공간에 있는
  #    차량에만 쓸 것(실물 지게차는 미니어처 공간, 시뮬은 20×30 창고라 좌표가 우연히 겹친다).
  #    2026-08-10: 실물을 "정지"로 묶었는데도 위치가 계속 들어와 시뮬 두 대가 SAFETY_DISTANCE
  #    로 15분간 서 있었다. 명령을 끊는 것과 판단에서 빼는 것은 다른 일이다.
  ignored-vehicles: ${TRAFFIC_IGNORED_VEHICLES:}
  # 최소 안전거리(m). FR 의 "최소 안전거리".
  safe-distance-m: ${TRAFFIC_SAFE_DISTANCE_M:6.0}
  # 정지 판단 거리(m). 안전거리에 여유를 더한 값이라 보통 safe-distance-m 이상이다.
  hold-distance-m: ${TRAFFIC_HOLD_DISTANCE_M:9.0}
  # 재개 임계 배수. 정지·재개를 같은 거리로 판단하면 경계에서 STOP/RESUME 이 매 tick 번갈아 나간다.
  release-hysteresis: ${TRAFFIC_RELEASE_HYSTERESIS:1.2}
  # 예측 시간(초). 현재 속도·방향이 이만큼 유지된다고 보고 미래 위치를 잡는다.
  prediction-horizon-s: ${TRAFFIC_PREDICTION_HORIZON_S:2.0}
  # 선반 작업 구역 반경(m). storage_slot 의 접근 좌표를 중심으로 한 원.
  work-zone-radius-m: ${TRAFFIC_WORK_ZONE_RADIUS_M:3.0}
  # 순환로 기하. 좌표는 시뮬 좌표계(20 × 30)이며 백엔드는 변환하지 않는다.
  # F팀 isaac_sim/nav2/scripts/track.py 와 같은 값이어야 한다 — 갈라지면 시뮬과 관제가
  # 서로 다른 앞차를 보게 된다.
  loop:
    # 반시계: 아래 +x → 오른쪽 +y → 위 -x → 왼쪽 -y. 둘레 67.0
    corners:
      - { x: 15.5, y: 4.0 }
      - { x: 15.5, y: 27.0 }
      - { x: 5.0, y: 27.0 }
      - { x: 5.0, y: 4.0 }
    # 모서리 도달 판정(m). 이 안에 들면 지난 것으로 보고 다음 모서리를 준다.
    corner-tol-m: ${TRAFFIC_LOOP_CORNER_TOL_M:2.0}
    # 순환로 이탈 판정(m). 바이·랙으로 빠진 차량을 차간 판정에서 빼는 기준.
    off-track-tol-m: ${TRAFFIC_LOOP_OFF_TRACK_TOL_M:3.0}
    # 합류 허가 최소 간격(m). 앞차가 이보다 가까우면 새 차를 내보내지 않는다.
    entry-headway-m: ${TRAFFIC_LOOP_ENTRY_HEADWAY_M:10.0}
    # 합류 허가 간격(ms). 한 대 내보낸 뒤 이만큼 기다린다(동시 출발 방지).
    entry-interval-ms: ${TRAFFIC_LOOP_ENTRY_INTERVAL_MS:3000}
    # 정체 감시. 이 시간 동안 stall-move-m 보다 적게 움직이면 목표를 다시 보낸다.
    stall-sec: ${TRAFFIC_LOOP_STALL_SEC:20}
    stall-move-m: ${TRAFFIC_LOOP_STALL_MOVE_M:0.3}
  # 주기 상태기계(바이 → 적재 → 랙). F팀 데모와 동시에 켜면 서로 목표를 밀어내므로
  # 기본은 꺼 둔다. 켜기 전에 F팀에 데모를 꺼 달라고 할 것.
  cycle:
    enabled: ${TRAFFIC_CYCLE_ENABLED:false}
    # 입고 바이(진입 yaw 0=동), 바이 탈출점(yaw 1.5708=북). 라디안이다.
    bay: { x: 16.5, y: 5.0, yaw: 0.0 }
    exit: { x: 15.5, y: 4.0, yaw: 1.5708 }
    arrive-tol-m: ${TRAFFIC_CYCLE_ARRIVE_TOL_M:1.5}
    # 규칙 1(일방통행). 스테이션 진입점까지 남은 호장이 이 값 이하가 되면 순환로를 벗어나
    # 목적지로 직행하고, 그 전까지는 모서리를 하나씩 돈다. 이 값을 키우면 일찍 빠져나가
    # 창고 가운데를 가로지르게 되므로 함부로 올리지 말 것 — 규격 APPROACH_TRIGGER 는 4.0 이다.
    approach-trigger-m: ${TRAFFIC_CYCLE_APPROACH_TRIGGER_M:4.0}
    # 작업 단계 상한(ms). 무한 대기를 막는 안전장치이며, 단계 전이는 loaded 로 판정한다.
    # 정렬 판정 (규격 §5). state 가 아니라 telemetry 의 busy 로 판정한다 —
    # 정렬이 끝나도 state 는 LOADING 을 유지하므로 구별이 안 된다.
    #   경과 < min      → 아직 (정렬 자체가 최대 8초, 지시 반영에 200~400ms)
    #   경과 > timeout  → busy 와 무관하게 진행 (안전장치)
    #   그 사이         → busy == false 여야 완료
    align-min-dwell-ms: ${TRAFFIC_CYCLE_ALIGN_MIN_DWELL_MS:7000}
    align-timeout-ms: ${TRAFFIC_CYCLE_ALIGN_TIMEOUT_MS:12000}
    load-timeout-ms: ${TRAFFIC_CYCLE_LOAD_TIMEOUT_MS:40000}
    place-timeout-ms: ${TRAFFIC_CYCLE_PLACE_TIMEOUT_MS:90000}
    # 바이에서 받을 화물 높이. 이 값만 실물 m 다(규격 §6).
    # **첫 주기**에만 쓴다 — 시연에서 처음 나오는 상자는 실제 물건이고 카메라가 그 높이를 잰다.
    cargo-height-m: ${TRAFFIC_CYCLE_CARGO_HEIGHT_M:0.15}
    # 두 번째 주기부터는 이 범위에서 무작위로 뽑는다(실물 m). 박스가 늘 같은 크기면 늘 같은
    # 층에 쌓여 층 판정이 보이지 않는다. **층 임계를 사이에 두도록** 잡을 것 —
    # 지금 0층 0.14 / 1층 0.2 기준 임계는 0.103 이라 0.07~0.14 면 반반쯤 갈린다.
    cargo-height-random-min-m: ${TRAFFIC_CYCLE_CARGO_HEIGHT_RANDOM_MIN_M:0.07}
    cargo-height-random-max-m: ${TRAFFIC_CYCLE_CARGO_HEIGHT_RANDOM_MAX_M:0.14}
    # 화물 높이로 층을 고른다. 켜면 아래 racks 배정표는 **폴백**이 된다 — 높이를 모르는
    # 차량(그 필드를 안 보내는 실물)이나 DB 조회 실패 때만 쓰인다.
    placement-enabled: ${TRAFFIC_CYCLE_PLACEMENT_ENABLED:true}
    # telemetry 의 화물 높이(시뮬 단위)를 실물 m 로 바꾸는 배수. 좌표계가 실물의 10 배다.
    cargo-height-scale: ${TRAFFIC_CYCLE_CARGO_HEIGHT_SCALE:0.1}
    # 차량별 랙 배정. 실물(fk01)에 B랙을 주는 이유는 오른쪽 통로가 넓어 사람이 접근하기 쉬워서다.
    # 0층(바닥, AFxx/BFxx)을 먼저 다 채우고 1층(선반, A0xx/B0xx)으로 올라간다 — 낮은 층
    # 먼저(팀 결정). 기존 A001..A012 가 **선반** 이다(rack_slots.csv 의 place_z 1.325).
    # 두 대가 각자 24칸씩 맡아 48칸을 남김없이 덮는다. 그래야 "EMPTY 가 없을 때 복귀" 가 성립한다.
    racks:
      REAL-F01: [BF01, BF02, BF03, BF04, BF05, BF06, BF07, BF08, BF09, BF10, BF11, BF12,
                 B001, B002, B003, B004, B005, B006, B007, B008, B009, B010, B011, B012]
      SIM-F02: [AF01, AF02, AF03, AF04, AF05, AF06, AF07, AF08, AF09, AF10, AF11, AF12,
                A001, A002, A003, A004, A005, A006, A007, A008, A009, A010, A011, A012]
      SIM-F03: [BF01, BF02, BF03, BF04, BF05, BF06, BF07, BF08, BF09, BF10, BF11, BF12,
                B001, B002, B003, B004, B005, B006, B007, B008, B009, B010, B011, B012]
    # 복귀 지점 — 랙이 다 차면 여기로 돌아와 멈춘다. 시뮬 시작 위치와 같게 둔다.
    # 비워 두면 그 차량은 복귀하지 않고 있던 자리에 선다(모르는 좌표로 보내지 않는다).
    home:
      SIM-F02: { x: 4.0, y: 4.0, yaw: 0.0 }
      SIM-F03: { x: 4.0, y: 6.0, yaw: 0.0 }
  # 위치가 이보다 오래되면 판단에서 제외한다(낡은 좌표로 "안전"을 선언하지 않기 위해).
  stale-location-ms: ${TRAFFIC_STALE_LOCATION_MS:2000}

logging:
  level:
    root: INFO
    com.fast.backend: INFO
