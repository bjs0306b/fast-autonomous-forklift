spring:
  application:
    name: fast-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: always
    deserialization:
      adjust-dates-to-context-time-zone: false

server:
  port: ${SERVER_PORT:8080}

storage:
  placement:
    # 단위는 m이며 화물 높이에는 팔레트 높이를 포함하지 않는다.
    height-clearance: ${STORAGE_PLACEMENT_HEIGHT_CLEARANCE:0.25}
    pallet-height-m: ${STORAGE_PLACEMENT_PALLET_HEIGHT_M:0.12}
    max-overhang-ratio-exclusive: ${STORAGE_PLACEMENT_MAX_OVERHANG_RATIO_EXCLUSIVE:0.05}

station:
  session:
    ttl-seconds: ${STATION_SESSION_TTL_SECONDS:600}
  measurement-request:
    max-attempts: ${STATION_MEASUREMENT_MAX_ATTEMPTS:3}

logging:
  level:
    root: INFO
    com.fast.backend: INFO
