# =============================================================================
# mqttcheck 프로필 — "실제 Mosquitto 연결·구독·발행" 검증 전용
# =============================================================================
#
# 목적
#   Jira "MQTT 브로커 구축·구독 연결"의 완료 조건 중 자동 테스트로는 증명할 수 없는 항목
#   (실제 브로커 연결, 실제 구독, 실제 메시지 왕복, retained 동작, 재연결)을 개발 PC에서
#   재현 가능하게 검증하기 위한 프로필이다.
#
# 왜 local 프로필을 쓰지 않는가
#   local 프로필은 MySQL(`fast_backend`) 자격증명을 요구한다. 브로커 연동만 확인하려는
#   사람에게 DB 비밀번호를 요구하면 검증 자체가 막히고, 비밀번호를 저장소에 적어 두는
#   더 나쁜 선택으로 이어진다. 이 프로필은 DB를 임베디드 H2로 대체해 **MQTT 경로만**
#   독립적으로 검증한다.
#
# 왜 test 프로필을 쓰지 않는가
#   test 프로필은 `mqtt.enabled=false`로 실제 브로커 접속을 의도적으로 차단한다
#   (@SpringBootTest 컨텍스트가 여러 개 뜰 때 clientId 충돌 방지). 그 차단이 바로
#   "실제 연결"을 증명하지 못하게 만드는 원인이므로 별도 프로필이 필요하다.
#
# 실행 (기본 브로커는 아래 mqtt.broker-url 이 정한다. 환경변수로 재정의 가능)
#
# ⚠️ 종전 이 주석은 "기본 브로커는 AI와 같은 70.12.130.106:1883" 이라고 적고 있었다.
#    그 GPU서버 브로커는 **2026-08-03에 내려갔고**(프로세스 0개) 운영 브로커는 EC2
#    TLS 8883 하나뿐이다. 이 프로필은 애초에 로컬 브로커 전용이므로 그 주소를
#    되살려 쓰지 말 것 — 지금 그 주소로 붙으면 그냥 연결이 안 된다.
#   mvn spring-boot:run "-Dspring-boot.run.profiles=mqttcheck"
#
# 주의
#   - 이 프로필은 **개발 PC의 안전한 로컬 브로커 전용**이다. 실제 차량·임베디드가 연결된
#     브로커를 가리키게 하지 말 것 — 명령 발행 검증이 실제 차량을 움직일 수 있다.
#   - 데이터는 인메모리라 종료 시 사라진다. 운영 데이터에 영향을 주지 않는다.
# =============================================================================

spring:
  datasource:
    # 인메모리 H2를 MySQL 호환 모드로 띄운다(application-test.yml과 동일한 방식).
    url: jdbc:h2:mem:fast_backend_mqttcheck;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      # 스키마와 시드 차량(SIM-F01)을 함께 적용한다. 시드가 있어야
      # 상태 메시지가 "미등록 차량"으로 폐기되지 않고 DB까지 도달하는지 확인할 수 있다.
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-local.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fast.backend.vehicle.domain
  configuration:
    map-underscore-to-camel-case: true

mqtt:
  # 이 프로필의 핵심: 실제 브로커에 붙는다.
  enabled: true
  # 검증 중 임의 토픽으로 손수 발행해 볼 수 있도록 테스트 API를 켠다.
  test-api:
    enabled: true
  # 기본값은 로컬. 종전 GPU서버 기본값은 브로커가 죽어 조용히 실패한다(local 프로필 주석 참조).
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  # local 프로필과 다른 clientId를 쓴다 — 같은 clientId로 접속하면 먼저 붙어 있던
  # 쪽이 브로커에서 끊기므로, 로컬 앱을 띄운 채로 검증을 돌려도 서로 방해하지 않는다.
  inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:fast-backend-mqttcheck-inbound}
  outbound-client-id: ${MQTT_OUTBOUND_CLIENT_ID:fast-backend-mqttcheck-outbound}
  connection-timeout: 10
  keep-alive-interval: 30
  automatic-reconnect: true
  clean-session: true
  # 확정 규격: 구독 MQTT QoS 1.
  default-qos: ${MQTT_DEFAULT_QOS:1}
  completion-timeout: 5000
  recovery-interval: 5000
  topics:
    forklift-status: forklift/+/status
    forklift-location: forklift/+/location
    forklift-path: forklift/+/path
    forklift-command-result: forklift/+/command-result
    station-measure-request: fast/station/measure_request
    forklift-command: forklift/%s/command

vehicle:
  auto-registration-enabled: false
  offline-check-enabled: false
  offline-timeout-seconds: 10
  # 상태 갱신을 REST로도 넣어볼 수 있게 켠다(MQTT 경로와 비교용).
  status-test-api:
    enabled: true

websocket:
  allowed-origin-patterns: "*"

logging:
  level:
    # 연결·구독·수신·라우팅 로그를 전부 보기 위해 이 프로필에서만 DEBUG로 낮춘다.
    com.fast.backend.mqtt: DEBUG
    com.fast.backend.vehicle: DEBUG
    com.fast.backend.forklift: DEBUG
    org.springframework.integration.mqtt: DEBUG
