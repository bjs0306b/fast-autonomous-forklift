# local 프로필 전용 설정 파일
# 민감한 값(비밀번호, 토큰 등)은 이 파일에 직접 작성하지 않는다.
# MQTT 접속 관련 값은 환경변수(${VAR:기본값})로 오버라이드할 수 있다(prompt11.md).
# 환경변수를 아무것도 설정하지 않으면 아래 기본값(로컬 Mosquitto, 인증 없음)이 그대로 적용되어
# 기존 로컬 개발 흐름과 동일하게 동작한다. EC2 공용 Broker에 접속하려면 MQTT_BROKER_URL/
# MQTT_USERNAME/MQTT_PASSWORD 등을 환경변수로 주입하면 된다(자세한 내용은
# prompt/answer/answer11.md, README.md의 "EC2 Mosquitto Broker 연동" 참고).
# username/password는 값이 비어 있으면 MqttConfig가 MqttConnectOptions에 아예 설정하지 않는다.

mqtt:
  # MQTT 인프라(Client Factory/Channel/Adapter/Handler) 활성화 여부.
  enabled: ${MQTT_ENABLED:true}
  # POST /api/mqtt/test(검증용 임시 발행 API) 활성화 여부. 기본값은 false(비활성)이며,
  # 로컬 개발 환경에서만 명시적으로 true로 켠다(prompt9.md 기준 기본값 정책과 동일).
  test-api:
    enabled: ${MQTT_TEST_API_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:fast-backend-inbound}
  outbound-client-id: ${MQTT_OUTBOUND_CLIENT_ID:fast-backend-outbound}
  connection-timeout: 10
  keep-alive-interval: 30
  automatic-reconnect: true
  clean-session: true
  default-qos: ${MQTT_DEFAULT_QOS:1}
  completion-timeout: 5000
  recovery-interval: 5000
  topics:
    forklift-status: forklift/+/status
    forklift-location: forklift/+/location
    forklift-path: forklift/+/path
    forklift-command-result: forklift/+/command-result
    forklift-fork-status: forklift/+/fork-status
    forklift-error: forklift/+/error
    cargo-detected: cargo/detected
    # 이동·포크·적재·비상정지 모든 명령이 쓰는 단일 발행 토픽(prompt32.md 1장 7번 확정).
    # 구 forklift-emergency 전용 토픽은 사용처가 없어 제거했다.
    forklift-command: forklift/%s/command
    # 측정 스테이션 측정 결과 v1.0 (FR-101-5, MR !36) — 스테이션 PC가 추론·판정 후 결과만 발행
    station-measurement: fast/station/+/measurement

# ---------------------------------------------------------------
# FR-501-1: 차량 등록·상태 집계 (prompt16.md, answer15.md)
# ---------------------------------------------------------------

# MySQL 연결 정보. EC2/로컬 MySQL 서버 정보를 환경변수로 주입한다(MQTT와 동일한 패턴).
# 비밀번호를 이 파일에 직접 쓰지 않는다 — 기본값도 비워둬서, 값을 안 넣으면 접속 시도 시점에
# 바로 인증 실패로 드러나게 한다(잘못된 값으로 조용히 동작하는 것보다 안전).
#
# 주의: 이 저장소는 스키마(schema.sql)를 애플리케이션이 자동으로 실행하도록 설정하지 않았다.
# 팀이 공유하는 MySQL에 기동 한 번으로 테이블이 생성/변경되는 것을 막기 위한 의도적 결정이다.
# 최초 1회는 src/main/resources/db/schema.sql 내용을 MySQL 클라이언트로 직접 실행해야 한다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fast_backend?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fastbackend}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # schema-locations는 일부러 설정하지 않는다(위 설명 참고) — data-locations만 자동 실행되며,
      # data-local.sql은 INSERT IGNORE라 반복 실행해도 안전하다.
      mode: always
      data-locations: classpath:db/data-local.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fast.backend.vehicle.domain
  configuration:
    map-underscore-to-camel-case: true

vehicle:
  # MQTT 최초 수신 시 자동 등록 여부. 기본 false(사전 등록 방식) — 담당자 답변 후 활성화 검토
  # (prompt16.md 3장). 지금은 이 값을 참조하는 로직 자체가 없다(자동 등록 기능 미구현).
  auto-registration-enabled: ${VEHICLE_AUTO_REGISTRATION_ENABLED:false}
  # 온라인/오프라인 자동 판정. 기본 false — Scheduler는 후속 작업으로 분리(prompt16.md 17장).
  offline-check-enabled: ${VEHICLE_OFFLINE_CHECK_ENABLED:false}
  offline-timeout-seconds: ${VEHICLE_OFFLINE_TIMEOUT_SECONDS:10}
  # PUT /api/vehicles/{vehicleId}/status 테스트 API 활성화 여부. mqtt.test-api.enabled와 동일한 패턴.
  status-test-api:
    enabled: ${VEHICLE_STATUS_TEST_API_ENABLED:true}

# ---------------------------------------------------------------
# WebSocket (prompt20.md, answer20.md) — 차량 상태·위치·명령 결과 실시간 전송
# ---------------------------------------------------------------

# 운반 작업 MQTT 디스패치(prompt48.md 19장). 기본 false — 실제 차량 명령이 실수로 발행되지 않도록 한다.
# ROS2와 TRANSPORT 명령 규격이 확정되고 실환경 검증이 끝난 뒤에만 true로 켠다.
dispatch:
  mqtt:
    enabled: ${DISPATCH_MQTT_ENABLED:false}

# REST API CORS 허용 Origin(개발 환경). 브라우저 프론트(Next.js dev server)가
# http://localhost:3000 에서 http://localhost:8080 을 호출하므로 이 Origin을 허용해야
# preflight(OPTIONS)가 403으로 막히지 않는다. 여러 개면 쉼표로 구분한다.
# 값을 비우면 CORS 자체가 비활성화된다(WebCorsConfig 참고).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

websocket:
  # STOMP 엔드포인트(/ws)의 허용 Origin. 프론트엔드 배포 주소가 아직 확정되지 않아 기존과 동일하게
  # "*"(전체 허용)를 기본값으로 둔다. 운영 환경에서는 반드시 실제 프론트 Origin으로 좁혀야 한다.
  # 예: WEBSOCKET_ALLOWED_ORIGIN_PATTERNS=https://fast.example.com
  # 로컬 개발 중 특정 프론트 개발 서버(예: http://localhost:5173, http://localhost:3000)로만 좁히고
  # 싶다면 쉼표로 구분해 값을 전달하면 된다: http://localhost:5173,http://localhost:3000
  allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:*}
