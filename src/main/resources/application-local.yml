spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fast_backend?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:fastbackend}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      data-locations: classpath:db/data-local.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fast.backend
  configuration:
    map-underscore-to-camel-case: true

mqtt:
  enabled: ${MQTT_ENABLED:true}
  test-api:
    enabled: ${MQTT_TEST_API_ENABLED:false}
  # ⚠️ 기본값은 **로컬 브로커**다. 종전 기본값(GPU서버 `tcp://70.12.130.106:1883`)은
  #    mosquitto 가 죽어 있어(2026-08-03 실측: 프로세스·리스너 모두 없음) 붙어도
  #    **에러 없이 조용히 아무 데도 안 간다** — 발행이 허공으로 가고 트리거가 사라진다.
  #    배포에서는 backend.env 의 MQTT_BROKER_URL(=ssl://fast-mosquitto:8883)이 덮는다.
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  # ssl:// 브로커(EC2)에서만 쓴다. 비우면 JVM 기본 트러스트스토어를 쓴다(MqttProperties 주석 참고).
  ca-cert-path: ${MQTT_CA_CERT_PATH:}
  # 현재 EC2 인증서 CN/SAN이 호스트명과 일치하지 않아 기본 false. CA 검증 자체는 유지한다.
  ssl-hostname-verification-enabled: ${MQTT_SSL_HOSTNAME_VERIFICATION_ENABLED:false}
  inbound-client-id: ${MQTT_INBOUND_CLIENT_ID:fast-backend-inbound}
  outbound-client-id: ${MQTT_OUTBOUND_CLIENT_ID:fast-backend-outbound}
  connection-timeout: 10
  keep-alive-interval: 30
  automatic-reconnect: true
  clean-session: true
  default-qos: ${MQTT_DEFAULT_QOS:1}
  completion-timeout: 5000
  recovery-interval: 5000
  topics:
    forklift-status: forklift/+/status
    forklift-location: forklift/+/location
    forklift-path: forklift/+/path
    forklift-command-result: forklift/+/command-result
    station-measure-request: fast/station/measure_request
    forklift-command: forklift/%s/command
    # Isaac Sim 차량 telemetry. 기존 forklift 토픽을 대체하지 않고 함께 구독한다.
    isaac-telemetry: ${MQTT_ISAAC_TELEMETRY_TOPIC:fast/v1/vehicle/+/telemetry}
    isaac-event: ${MQTT_ISAAC_EVENT_TOPIC:fast/v1/vehicle/+/event}
    forklift-arrived: ${MQTT_FORKLIFT_ARRIVED_TOPIC:forklift/+/arrived}

vehicle:
  # MQTT 로 처음 관측된 vehicleId 를 자동 등록한다. 브로커가 보내는 차량 수만큼 관제 화면에 뜨게
  # 하는 유일한 경로다 — 꺼 두면 DB 시드에 적힌 차량만 보인다(미등록 차량 메시지는 폐기).
  auto-registration-enabled: ${VEHICLE_AUTO_REGISTRATION_ENABLED:true}
  offline-check-enabled: ${VEHICLE_OFFLINE_CHECK_ENABLED:false}
  offline-timeout-seconds: ${VEHICLE_OFFLINE_TIMEOUT_SECONDS:10}
  # 외부 시스템 차량 ID → DB vehicle_id 별칭. 키 비교는 대소문자를 무시한다.
  # DB 의 vehicle_id 를 바꾸지 않고 백엔드 경계에서만 정규화한다.
  #
  # 현재 계약(F팀 backend-mqtt-guide, 2026-08-05):
  #   Isaac 프림 SIM_F02 → sim02 · SIM_F03 → sim03 · 실물 오린카 → fk01
  #   ⚠️ sim01 은 그 개편 전 이름이다. 남겨 두는 이유는 구 발행자가 아직 있을 수 있어서이고,
  #      새로 쓰지 말 것.
  #
  # ⚠️ 별칭이 없으면 auto-registration 이 그 원본 ID(예: fk01)로 **별개 차량을 새로 만든다**.
  #    관제 화면에 같은 차량이 두 대로 보이게 되므로 새 ID 가 생기면 여기에 먼저 추가한다.
  id-aliases:
    sim01: SIM-F01
    sim02: SIM-F02
    sim03: SIM-F03
    fk01: REAL-F01
  status-test-api:
    enabled: ${VEHICLE_STATUS_TEST_API_ENABLED:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

websocket:
  allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:*}
