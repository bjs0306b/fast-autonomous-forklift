# GitLab CI — EC2 자동배포
#
# develop 에 **배포 산출물에 영향을 주는 변경**이 들어오면 EC2 에 배포한다.
# 러너가 배포 대상 서버 위에서 돌기 때문에 SSH 키나 배포용 자격증명을 CI 변수에
# 넣지 않는다.
#
# 러너 등록: docs/deploy/ec2-auto-deploy.md
#
# ⚠️ 조건에 걸리면 무조건 배포한다(팀 결정, Jira S15P11A304-179).
#    깨진 머지가 그대로 시연 서버에 올라간다는 뜻이다. 완화책은 두 겹이다.
#      1) 이미지 빌드 단계에서 `./mvnw clean package` 가 테스트를 돈다 —
#         테스트가 깨지면 빌드가 실패하고 **돌던 컨테이너는 건드리지 않는다.**
#      2) 기동 후 헬스체크가 실패하면 직전 이미지로 롤백한다.
#    그래도 "테스트는 통과하는데 실제로 망가진" 변경은 막지 못한다.

stages:
  - deploy

# 배포를 트리거하는 경로.
#
# ⚠️ 이 목록은 `scripts/deploy-ec2.sh` 의 `DEPLOY_PATHS` 와 **같아야 한다.**
#    동기화되는 것과 배포를 트리거하는 것이 어긋나면, 서버에 반영은 되는데
#    배포는 안 도는(혹은 그 반대) 상태가 된다. 한쪽을 고치면 다른 쪽도 고칠 것.
#
# 여기 없는 것(docs/·ai/·ros2_ws/·isaac_sim/·firmware/ 등)만 바뀐 병합은
# 배포를 돌리지 않는다. 매번 maven·npm 빌드를 다시 하고 컨테이너를 재시작하는
# 것은 낭비이고, 재시작하는 동안 짧은 다운타임이 생긴다.
.deploy_paths: &deploy_paths
  - src/**/*
  - pom.xml
  - mvnw
  - .mvn/**/*
  - frontend/monitoring-control-system/**/*
  - infra/**/*
  - Dockerfile.backend
  - docker-compose.yml
  - .dockerignore
  - scripts/deploy-ec2.sh
  - .gitlab-ci.yml

deploy:ec2:
  stage: deploy
  tags:
    - ec2
  environment:
    name: production
    url: http://i15a304.p.ssafy.io:3000
  # 배포는 절대 동시에 돌면 안 된다. 두 파이프라인이 같은 디렉터리에 rsync 하면
  # 반쯤 섞인 소스로 이미지가 빌드된다. resource_group 이 순차 실행을 보장한다.
  resource_group: production
  # 배포 중인 잡은 중간에 죽이지 않는다 — 컨테이너가 내려간 상태로 남을 수 있다.
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *deploy_paths
      when: always
    - when: never
  script:
    - chmod +x scripts/deploy-ec2.sh
    - ./scripts/deploy-ec2.sh
  timeout: 30m

# 배포를 건너뛴 경우에도 파이프라인에 잡이 하나는 있어야 한다.
# 잡이 하나도 없으면 GitLab 이 파이프라인을 만들지 못하고, 화면에서는 실패나
# 오류처럼 보인다 — "배포를 안 한 것"과 "파이프라인이 깨진 것"이 구분되지 않는다.
deploy:skipped:
  stage: deploy
  tags:
    - ec2
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes: *deploy_paths
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never
  script:
    - echo "배포 대상 경로에 변경이 없어 배포를 건너뜁니다."
    - echo "대상 경로는 .gitlab-ci.yml 의 .deploy_paths 를 참조하세요."
