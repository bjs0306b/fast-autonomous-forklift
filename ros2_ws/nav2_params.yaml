controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # 비용 규제 감속이 걸리면 속도가 regulated_linear_scaling_min_speed(0.04)
      # 까지 떨어진다. 그 속도로 0.5 m 는 12.5초, min_approach(0.03)면 16.7초다.
      # 10초로는 **제대로 가고 있어도 abort** 됐다. 인플레이션 0.55 m 가 2 m 폭
      # 경기장 전체를 덮어 규제가 상시 걸리므로 예외 상황이 아니라 평시다.
      movement_time_allowance: 25.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # Must be smaller than field_lap.max_segment_length_m; otherwise a short
      # exploration goal is accepted without actually extending the SLAM map.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
    # DWB parameters
    # Rear-steered forklift path controller
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.10 -> 0.08. teleop.yaml 의 max_linear_mps 0.10 아래에 두어야
      # 조향 보정이나 가속이 상한에 부딪히지 않는다.
      desired_linear_vel: 0.15
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.30
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      # ⚠️ **이 값을 올려 "회전이 안 된다" 를 해결하지 말 것.**
      #
      # 한 번 0.08 로 올렸는데, 회전을 빠져나온 직선 구간에도 그 속도가 그대로
      # 남아 과속해서 벽을 받았다. 크게 꺾을 때 힘이 모자라는 것은 토크 문제
      # 이고, teleop.yaml 의 steered_speed_boost 가 **조향각에 비례해** 실시간
      # 으로 올린다 -- 핸들이 펴지면 그 순간 원래대로 돌아온다.
      # 0.08 -- 이 차의 **안정 최저 속도가 0.078 m/s** 다 (2026-08-07 실측,
      # 유지 듀티 12% 에서 100% 연속). 그보다 낮게 명령해도 차는 0.078 로 가고,
      # 목표가 그 근처면 컨트롤러가 하한 주위에서 헌팅해 가다 서다를 반복한다.
      #
      # ⚠️ 반대로 올리지도 말 것. max_linear_mps 가 0.10 이고 정지거리를 그
      #    값으로 유도했다. 쓸 수 있는 범위는 0.078~0.10 로 좁다.
      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.30
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # 이 반경보다 급한 곡선에서 감속이 시작된다. 플래너 최소반경과 같은
      # 값이어야 한다 — 크게 두면 계획된 모든 곡선에서 감속이 걸리고, 그
      # 속도는 실측 스톨 구간이라 차가 아예 멎는다.
      regulated_linear_scaling_min_radius: 0.25
      # 위 min_approach_linear_velocity 주석 참고 -- 여기도 올리지 말 것.
      # 위와 같은 이유. 곡률 규제도 0.078 아래로는 의미가 없다.
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: false
      # No rear obstacle sensor is installed.  Reeds-Shepp + reversing made
      # Nav2 choose a negative-velocity path even for the first forward lap
      # goal, where the low reverse ramp could not overcome static friction.
      allow_reversing: false
      max_angular_accel: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.190, 0.074], [0.190, -0.074], [-0.245, -0.074], [-0.245, 0.074]]"
      footprint_padding: 0.01
      # LiDAR 와 ToF 를 **별도 레이어**로 둔다. 레이어끼리는 combination_method
      # 기본값(1 = Maximum)으로 합쳐지므로 한 레이어의 "비었음" 이 다른 레이어의
      # "막힘" 을 지울 수 없다. 그래서 양쪽 다 clearing 을 켜도 서로를 못 지운다.
      #
      # 한 레이어에 같이 두던 때는 그게 불가능했다. ToF 의 45도 원뿔이 멀리서
      # LiDAR 평면(z 약 0.20m)을 침범해 유효한 장애물을 지우기 때문에 ToF 만
      # clearing 을 꺼야 했고, 그 결과 ToF 가 찍은 표시는 **아무도 못 지웠다.**
      # 사람이 한 번 지나가면 영구 유령 벽이 됐다.
      plugins: ["voxel_layer_lidar", "voxel_layer_tof", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # 상부 LiDAR 전용. 스캔 평면(z 약 0.20m) 위아래를 모두 관장한다.
      voxel_layer_lidar:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        # 16 이 상한이다 (복셀당 2비트, uint32 패킹). 16 x 0.05 = 0.80 m 까지만
        # 격자에 존재하므로 max_obstacle_height 를 그보다 크게 적어도 의미가 없다.
        z_voxels: 16
        max_obstacle_height: 0.80
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.80
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # 포크 높이 ToF 전용. LiDAR 가 못 보는 낮은 장애물을 담당한다.
      #
      # clearing: True 로 켠다. 이 레이어의 광선이 z=0.20 을 지나며 지워도 그건
      # **이 레이어의 자기 격자**일 뿐이고, LiDAR 표시는 위 레이어에 있다.
      #
      # raytrace_max_range > obstacle_max_range 를 지킨다. 어기면 그 사이 거리의
      # 장애물이 영영 안 지워져 유령 벽이 남는다.
      voxel_layer_tof:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        # 이 두 값은 **마킹 높이가 아니라 광선이 지나갈 부피**다. 마킹 범위는
        # 소스별 min/max_obstacle_height(0.03~0.30)가 이미 쥐고 있고, 이 소스
        # 들은 그 위를 절대 안 찍는다.
        #
        # 0.40 이었을 때 클리어 광선이 1.2 m 앞 장애물에 못 닿았다. VoxelLayer
        # 는 광선이 격자를 벗어나는 지점에서 자르는데, 높이 0.74 m 로 올라가는
        # 광선은 천장 0.40 을 **0.94 m 에서** 뚫고 나가 거기서 끊겼다.
        # (2026-08-07 실측: clearing_endpoints 가 전부 0.93~0.95 m)
        #
        # nav2 의 VoxelGrid 는 32비트 워드에 2비트씩 채우므로 **z 는 최대 16겹**
        # 이다. 그 이상을 주면 "can only support up to 16 z values" 를 매 갱신마다
        # 찍으면서 레이어가 통째로 갱신을 멈춘다 -- 파라미터가 조용히 무시되는
        # 게 아니라 레이어가 죽는다.
        #
        # 16겹 x 0.05 = 0.80 m. 높이 0.74 m 로 올라가는 가장 가파른 행도 2.2 m
        # 까지 천장에 안 닿는다.
        z_voxels: 16
        max_obstacle_height: 0.80
        mark_threshold: 0
        observation_sources: tof_left tof_right tof_left_clear tof_right_clear
        tof_left:
          topic: /tof/left/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.03
          max_obstacle_height: 0.30
          obstacle_max_range: 2.0
          obstacle_min_range: 0.02
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        tof_right:
          topic: /tof/right/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.03
          max_obstacle_height: 0.30
          obstacle_max_range: 2.0
          obstacle_min_range: 0.02
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        tof_left_clear:
          # "측정했는데 아무것도 없다" 광선. **marking: false** 라서 이 소스는
          # 절대 장애물을 찍지 않는다. 그래서 높이 창을 넓게 열어도 안전하고,
          # 넓게 열어야만 한다 -- nav2 의 observation buffer 는 창 밖 점을
          # raytrace 대상에서도 통째로 버리기 때문에, 창이 좁으면 광선이
          # costmap 에 **도달조차 못 한다.** (2026-08-07 실측: 광선 높이가
          # 0.53~1.06 m 였는데 창이 0.30 이라 전부 버려지고 있었다.)
          #
          # 광선이 격자를 벗어나는 지점은 VoxelLayer 가 알아서 자른다 --
          # 아래로 가는 행은 바닥에서, 위로 가는 행은 천장에서. 그래서 여기서
          # 미리 걸러낼 이유가 없고, 걸러내면 지울 수 있는 것만 줄어든다.
          topic: /tof/left/points_clear
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        tof_right_clear:
          # "측정했는데 아무것도 없다" 광선. **marking: false** 라서 이 소스는
          # 절대 장애물을 찍지 않는다. 그래서 높이 창을 넓게 열어도 안전하고,
          # 넓게 열어야만 한다 -- nav2 의 observation buffer 는 창 밖 점을
          # raytrace 대상에서도 통째로 버리기 때문에, 창이 좁으면 광선이
          # costmap 에 **도달조차 못 한다.** (2026-08-07 실측: 광선 높이가
          # 0.53~1.06 m 였는데 창이 0.30 이라 전부 버려지고 있었다.)
          #
          # 광선이 격자를 벗어나는 지점은 VoxelLayer 가 알아서 자른다 --
          # 아래로 가는 행은 바닥에서, 위로 가는 행은 천장에서. 그래서 여기서
          # 미리 걸러낼 이유가 없고, 걸러내면 지울 수 있는 것만 줄어든다.
          topic: /tof/right/points_clear
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      
      footprint: "[[0.190, 0.074], [0.190, -0.074], [-0.245, -0.074], [-0.245, 0.074]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "voxel_layer_tof", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # 플래너는 **글로벌** costmap 위에서 경로를 짠다. 여기에 ToF 가 없으면
      # 낮은 장애물이 생기는 것도 지워지는 것도 모르므로, 재계획을 켜도 같은
      # 경로를 무한히 다시 낸다. ToF 를 단 이유가 바로 그 장애물이다.
      #
      # 로컬과 같은 이유로 별도 레이어다 — ObstacleLayer 에 섞으면 LiDAR 와
      # 서로 지운다. VoxelLayer 라야 높이별로 분리된다.
      voxel_layer_tof:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        # 위 로컬 설명 참고 -- 마킹 높이가 아니라 광선 통과 부피이고, 16겹이
        # VoxelGrid 의 상한이다.
        z_voxels: 16
        max_obstacle_height: 0.80
        mark_threshold: 0
        observation_sources: tof_left tof_right tof_left_clear tof_right_clear
        tof_left:
          topic: /tof/left/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.03
          max_obstacle_height: 0.30
          obstacle_max_range: 2.0
          obstacle_min_range: 0.02
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        tof_right:
          topic: /tof/right/points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: 0.03
          max_obstacle_height: 0.30
          obstacle_max_range: 2.0
          obstacle_min_range: 0.02
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        tof_left_clear:
          # "측정했는데 아무것도 없다" 광선. **marking: false** 라서 이 소스는
          # 절대 장애물을 찍지 않는다. 그래서 높이 창을 넓게 열어도 안전하고,
          # 넓게 열어야만 한다 -- nav2 의 observation buffer 는 창 밖 점을
          # raytrace 대상에서도 통째로 버리기 때문에, 창이 좁으면 광선이
          # costmap 에 **도달조차 못 한다.** (2026-08-07 실측: 광선 높이가
          # 0.53~1.06 m 였는데 창이 0.30 이라 전부 버려지고 있었다.)
          #
          # 광선이 격자를 벗어나는 지점은 VoxelLayer 가 알아서 자른다 --
          # 아래로 가는 행은 바닥에서, 위로 가는 행은 천장에서. 그래서 여기서
          # 미리 걸러낼 이유가 없고, 걸러내면 지울 수 있는 것만 줄어든다.
          topic: /tof/left/points_clear
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
        tof_right_clear:
          # "측정했는데 아무것도 없다" 광선. **marking: false** 라서 이 소스는
          # 절대 장애물을 찍지 않는다. 그래서 높이 창을 넓게 열어도 안전하고,
          # 넓게 열어야만 한다 -- nav2 의 observation buffer 는 창 밖 점을
          # raytrace 대상에서도 통째로 버리기 때문에, 창이 좁으면 광선이
          # costmap 에 **도달조차 못 한다.** (2026-08-07 실측: 광선 높이가
          # 0.53~1.06 m 였는데 창이 0.30 이라 전부 버려지고 있었다.)
          #
          # 광선이 격자를 벗어나는 지점은 VoxelLayer 가 알아서 자른다 --
          # 아래로 가는 행은 바닥에서, 위로 가는 행은 천장에서. 그래서 여기서
          # 미리 걸러낼 이유가 없고, 걸러내면 지울 수 있는 것만 줄어든다.
          topic: /tof/right/points_clear
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: -1.0
          max_obstacle_height: 2.0
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Forward-only field lap. DUBIN keeps the global path consistent with
      # the controller and avoids unsensed reverse motion.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # ⚠️ 이 값은 velocity_smoother 의 각속도 상한과 **짝이다**.
      #    상한 0.18 rad/s 에서 0.10 m/s 로 낼 수 있는 최소 반경은
      #    0.10/0.18 = 0.556 m 이므로, 0.54 는 컨트롤러가 추종할 수 없는 값이었다.
      #    0.40 rad/s 로 올리면서 0.10/0.40 = 0.25 로 맞춘다.
      #    기계 한계는 축거 0.144 / tan(36°) = 0.198 m 라 아직 여유가 있다.
      minimum_turning_radius: 0.25
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 3.0
      cache_obstacle_heuristic: false
      debug_visualizations: false

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"  
    
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    # ⚠️ 각속도 상한이 **실질 회전 능력을 정한다.** 0.18 rad/s 는 0.10 m/s 에서
    #    반경 0.556 m 로, 기계 한계(0.198 m)의 2.8배다. 폭 2 m 경기장에서
    #    장애물을 비켜나려면 전방 0.69 m 가 필요했는데 가드는 0.25 m 에서
    #    멈춰서, 멈춘 시점엔 이미 기하학적으로 회피가 불가능했다.
    #    0.40 rad/s 는 0.10 m/s 에서 후륜 29.9° · 반경 0.25 m 다.
    # ⚠️ **선속도 상한이 정지거리를 정한다.** 구동계는 0.40 m/s 까지 낼 수
    #    있지만(teleop.yaml max_linear_mps), 그 값으로 정지거리를 유도하면
    #    0.42 m 가 되어 2 x 3 m 목업에서는 차가 영구히 STOP 이다.
    #
    #    여기서 묶는 값이 곧 obstacle_avoidance.yaml 의 stop_distance_m 근거다.
    #    한쪽만 바꾸면 안 된다 -- tools/geometry_limits.py --speed 0.20 으로
    #    확인할 것.
    max_velocity: [0.20, 0.0, 0.40]
    min_velocity: [-0.20, 0.0, -0.40]
    max_accel: [0.20, 0.0, 0.40]
    max_decel: [-0.30, 0.0, -0.50]
    # EKF output. Keep this aligned with bt_navigator and Orin telemetry.
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
