obstacle_avoidance:
  ros__parameters:
    base_frame_id: base_link
    input_cmd_vel_topic: /cmd_vel
    output_cmd_vel_topic: /cmd_vel_safe

    # Roof-mounted 360-degree YDLIDAR.
    scan_topic: /scan
    # Both ToFs face forward at fork level. "left/right" means mounting
    # position, not a side-looking sensor orientation.
    front_tof_topics: ["/tof/left/points", "/tof/right/points"]
    vision_topic: /camera/obstacles
    status_topic: /obstacle_avoidance/status

    control_rate_hz: 20.0
    command_timeout_sec: 0.5
    sensor_timeout_sec: 0.5
    vision_timeout_sec: 0.5
    require_roof_lidar: true
    require_both_front_tof: true
    # Existing onboard model detects pallet/hole only. Enable this after a
    # person/vehicle detector publishes the documented JSON contract.
    require_vision: false

    lidar_front_half_angle_deg: 70.0
    lidar_center_half_angle_deg: 18.0
    tof_front_half_angle_deg: 35.0
    # Applied after ToF points are transformed into base_link. This removes
    # floor returns while retaining low obstacles between/around the forks.
    tof_min_height_m: 0.02
    tof_max_height_m: 0.80
    minimum_sector_hits: 2

    # base_link 기준이다. 사용자 현장 충돌 방지 조치와 명시적 승인 하에 0.25m.
    # footprint 전면 x=0.190m 대비 차체 여유는 0.06m다.
    # tools/geometry_limits.py --speed 0.35
    #
    # ⚠️ 0.35 는 **구동계 최대(0.40)가 아니라 nav2 velocity_smoother 가 묶는
    #    상한**이다. 그 상한을 올리면 여기도 같이 올려야 한다.
    #
    # 앞끝 0.190 + 패딩 0.010 + 제동 0.087 = 0.287.
    stop_distance_m: 0.29
    # 이 거리 **아래에서만** 가드가 조향에 개입한다. 여기부터 감속 시작
    # 거리(1.00) 사이에서는 감속만 하고 조향은 Nav2 에 맡긴다.
    #
    # 예전엔 감속대 전체에서 개입했다. 편향 0.15 rad/s 가 Nav2 가 실제로 내는
    # 0.03~0.12 보다 커서 더하면 조향이 **뒤집힌다.** 2026-08-07 실측에서
    # 15회 중 9회가 반대로 뒤집혔고, 후륜 조향이 좌우로 계속 흔들려 차가 한
    # 방향으로 힘을 실어 본 적이 없다 -- 정지마찰을 못 이긴 직접 원인.
    avoidance_engage_distance_m: 0.48
    # 전방 ToF 를 좌/중/우 방위 구간으로 가르는 중앙 구간 반각.
    # 이게 생기기 전엔 센서당 값 하나였고, 두 센서가 같은 앞을 보므로 값이
    # 거의 같아 좌우 판단이 **항상** LiDAR 로 떨어졌다 -- 포크 높이를 못 보는
    # 센서로 포크 높이 회피를 결정하고 있었다.
    tof_center_half_angle_deg: 12.0

    # ⚠️ **정지 판정은 각도 구간이 아니라 이 통로를 쓴다.**
    #
    # 각도로 정면을 정의하면 가까울수록 통로가 넓어진다 -- 0.27 m 에서 차체
    # 반폭 0.074 m 가 차지하는 각은 15.3° 뿐인데 좌/우 구간은 12~35° 다.
    # 그래서 모서리에 세워 두면 **옆벽을 정면 장애물로 읽어** 앞이 훤히 비어
    # 있어도 못 나갔다. ToF 가 멀티존이라 가로 오프셋을 그대로 볼 수 있으므로
    # 각도로 근사할 이유가 없다.
    #
    # 0.11 = 차체 반폭 0.074 + 여유 0.036. 조향 중 궤적이 살짝 벌어지는 것과
    # 위치 오차를 흡수한다. 넓히면 옆의 것에 다시 멈추고, 좁히면 모서리를
    # 긁는다.
    path_half_width_m: 0.11
    slowdown_distance_m: 1.00
    # 0.25배 + 0.18rad/s는 실측 Nav2 저속에서 PWM 유지 토크가 부족하고
    # 뒷바퀴가 36도 한계에 포화됐다. 전진 토크를 유지하면서 Nav2 조향에 작은
    # 좌/우 보정만 더한다. stop_distance_m 정지는 이 값과 무관하게 즉시 0이다.
    # ⚠️ **이 차에서 점진 감속은 명목상으로만 존재한다** (2026-08-07 실측).
    #
    # 안정 최저 속도가 0.078 m/s 라, 가드가 0.035 로 낮춰도 차는 0.078 로 간다.
    # 정지는 정상이다(0 명령이면 선다) -- 못 하는 것은 "천천히 가기" 뿐이다.
    # 정지거리는 상한 0.10 기준으로 유도했으므로 제동 여유 자체는 유효하다.
    #
    # 이 값을 낮춰 더 감속시키려 해도 소용없다. 실제로 느리게 가려면 구동계를
    # 바꾸거나(감속비·전압) 듀티를 PWM 처럼 끊어 써야 하는데, 후자는 지금
    # 하한 8% 시험에서 3초에 7번 끊기는 것으로 확인됐다.
    minimum_speed_scale: 0.80
    # ⚠️ 0.02 는 회피가 아니라 미세 보정이었다. 0.08 m/s 에서 곡률 0.25 →
    #    후륜 2.06° → 반경 4.0 m 다. 0.25~1.00 m 구간을 9.4초에 지나며 얻는
    #    헤딩 변화가 10.8° 뿐이라 장애물을 못 비켜났다.
    #
    #    0.15 는 0.08 m/s 에서 곡률 1.875 → 후륜 15.1° → 반경 0.53 m 다.
    #    기계 한계 36° 의 42% 라 포화 여유가 있다. Nav2 조향에 더해지는
    #    편향이고 max_abs_yaw_rate_rps 로 잘린다.
    avoidance_yaw_rate_rps: 0.15
    # ⚠️ **이건 회피 편향의 상한이 아니라 Nav2 명령까지 포함한 전체 상한이다.**
    #    0.35 는 순항 0.20 m/s 에서 곡률 1.75 → 후륜 **15.2°** 를 뜻한다.
    #    조향을 ±58° 로 넓히고 각가속도를 3.0 으로 올려도 여기서 잘려
    #    "왜 조향이 얕은가" 가 그대로 남는다 (2026-08-08 실측: w 를 0.6 으로
    #    주든 1.2 로 주든 통과값이 똑같이 15.2° 였다).
    #
    #    2.50 은 mapping.py 의 max_angular_rps 와 같은 값이다. 회전 깊이는
    #    거기서 곡률(min_command_turning_radius_m 0.10)로 이미 제한하므로,
    #    가드가 한 번 더 자를 이유가 없다. 회피 편향 자체는 위의
    #    avoidance_yaw_rate_rps 0.15 로 여전히 작게 유지된다.
    max_abs_yaw_rate_rps: 2.50
    tof_imbalance_m: 0.10
    lidar_clearance_margin_m: 0.15
    # 이 값 이상 비어 있어야 그쪽으로 틀 수 있다. 0.55 는 폭 2 m 경기장에서
    # **어느 지점에서도 통과할 수 없었다** — 주행 레인 x=0.50 의 벽 여유가
    # 0.426 m, x=1.55 는 0.376 m 다. 그래서 _choose_turn 이 항상 SLOW 를
    # 돌려주었고 가드는 애초에 조향할 수 없는 상태였다.
    # 0.30 -> 0.38 (2026-08-07, tools/geometry_limits.py).
    #
    # 0.30 은 **꼬리 휨을 안 넣은 값**이었다. 후륜 조향차가 최소반경 0.198 m 로
    # 돌면 바깥 뒷모서리가 0.380 m 를 휩쓴다 -- 회전반경보다 0.182 m 더 나간다.
    # 앞이 지나갈 수 있다고 보고 회전을 시작하면 뒤가 걸린다.
    #
    # ⚠️ **0.38 -> 0.28 (2026-08-08). 좌우는 앞뒤보다 과감하게 간다.**
    #    앞뒤와 좌우는 위험이 다르다. 앞뒤는 그대로 들이받지만, 좌우는 스치는
    #    관계이고 그 최악이 꼬리 휨이다. 그래서 같은 값을 쓸 이유가 없다.
    #
    #    기하학적 하한은 차체 반폭 0.074 + 꼬리 휨 0.182 = 0.256 m 다. 0.28 은
    #    거기에 0.024 를 남긴 값이고, 앞(0.29)·뒤(0.35) 보다 짧다.
    #
    #    0.38 이 실제로 막고 있던 것: 목업 아래쪽 벽을 따라 서 있으면 우측
    #    여유가 0.12 m 라 좌회전 판정이 아예 안 났고, 차는 앞뒤로만 흔들리며
    #    yaw 가 -1° 에서 꿈쩍도 안 했다. 경로도 컨트롤러도 정상이었다.
    #
    #    그래도 못 돌 만큼 좁으면 제자리 전환(pivot_node)이 맡는다 -- 전진·후진을
    #    번갈아 하며 조향으로 방향만 바꾸는 쪽이 옆을 긁는 것보다 낫다.
    minimum_turn_clearance_m: 0.28
    # 360도 상부 LiDAR의 후방 ±18도 통로. 자동 후진 복구 중 이 거리에서 정지.
    # 뒤끝 0.245 + 패딩 0.010 + 제동 0.087 = 0.343.
    rear_stop_distance_m: 0.35
    # 정후방 콘(±18°) 바깥의 고리. 조향하며 후진할 때 꼬리가 지나가는 곳이다.
    #
    # 유도: 후진 0.12 m/s + 반경 0.40 m 로 물러나면 패딩 발자국의 후방 바깥
    # 모서리가 후방축 기준 18°~42° 를 훑고, 0.6 rad(34°) 회전에서 0.481 m 까지
    # 나간다. 60° 면 그 오버슈트까지 덮는다.
    #
    # ⚠️ **90° 로 두지 말 것.** 정측면까지 열면 옆 평행벽이 후방 장애물로
    #    읽힌다 -- 전방 방위 구간에서 이미 겪은 실패다(위 주석 참고).
    lidar_rear_side_half_angle_deg: 60.0
    # 조향 후진에서 꼬리 쪽에 요구하는 여유. 이보다 좁으면 요만 0으로 접고
    # 직선 후진으로 저하시킨다(속도는 유지 -- 세우면 갇힌 채로 남는다).
    #
    # unstick 자신의 임계(0.50)보다 **낮게** 둔다. unstick 은 자기 정책으로
    # 먼저 판단하고, 여기는 텔레옵·tools/back_off.py 처럼 unstick 이 아닌
    # 출처가 낸 조향 후진만 걸러내는 백스톱이다.
    reverse_tail_clearance_m: 0.40
    # 꺾인 명령일수록 감속을 덜 한다.
    #
    # 감속과 조향이 겹치면 차가 선다 -- 곧게 갈 때 도는 듀티는 후륜이 옆으로
    # 갈아내는 상태를 못 이긴다. 그런데 가드는 장애물에 다가갈수록 속도를
    # 줄이고, 회피는 바로 그때 꺾는다. "피하려고 꺾었는데 그 자리에 서는"
    # 상태가 여기서 나온다.
    #
    # 1.0 = 회전 중에는 감속을 **전혀 안 한다.** 곧은 구간의 감속은 그대로
    # 두므로 제동거리는 지켜진다.
    steered_scale_relief: 1.0
    # 이 반경보다 급하게 돌면 완화가 100%다. 기동 한계(0.25 m, 조향 30°)가
    # 아니라 그보다 완만한 값을 쓴다 -- 스톨은 최대 락에서만 나는 게 아니라
    # 조금만 꺾여도 난다. 0.60 m 는 후륜 13.5° 이고, 그보다 급한 회전은
    # 전부 감속 없이 간다.
    full_relief_turning_radius_m: 0.60

# ⚠️ **unstick 도 여기서 파라미터를 받는다.** 종전에는 파라미터 파일 없이 떠서
#    노드 기본값이 그대로 실행됐다. tof_imbalance_m 처럼 가드와 같아야 하는
#    값이 조용히 어긋나면, 가드는 왼쪽이 막혔다고 보는데 탈출은 대칭이라고
#    보는 상태가 된다.
unstick_node:
  ros__parameters:
    # 가드와 **같은 값이어야 한다**. 위 obstacle_avoidance 절과 맞춰 둘 것.
    tof_imbalance_m: 0.10
    lidar_clearance_margin_m: 0.15

    # 탈출 후진의 곡률. **요레이트가 아니라 반경이다** -- 그래야
    # reverse_speed_mps 를 바꿔도 후륜각이 atan(0.144/0.40) = 19.8° 로
    # 고정된다. 고정 요레이트로 두면 속도가 오를 때 각이 같이 커져 구동
    # 모터가 못 이기는 영역으로 들어간다.
    #
    # 기동 가능 한계는 min_command_turning_radius_m 0.25 (= 29.9°) 이고,
    # 후진은 조향륜이 앞장서서 옆으로 갈아내므로 전진보다 불리하다. 그래서
    # 한계까지 안 쓰고 2/3 지점에 둔다.
    escape_turn_radius_m: 0.40
    # 조향을 넣어도 되는 시점. **갇힘 임계(rolling_mps 0.02)보다 높아야**
    # 한다 -- 임계 바로 위에서 놓으면 다시 선다.
    escape_rolling_mps: 0.05
    # 꺾은 채로 출발을 시도하는 시간. 이 안에 한 번도 못 구르면 각을 펴고
    # 곧게 간다.
    #
    # 종전에는 곧게 떠서 구른 뒤에 꺾었는데(2026-08-10 실측: 조향이 1.5초
    # 뒤에야 들어감), 그러면 후진 거리의 앞부분을 방향 안 바꾼 채 쓰고
    # 목업처럼 좁은 곳에서는 꺾기도 전에 뒤가 막혀 끝난다.
    escape_breakaway_sec: 1.5
    # 서보 정착 0.6 + 호 0.6초. 부스트 후 실제 요가 ~0.45 rad/s 라 약 21°.
    #
    # 2.0 초(=34°)로 두었더니 필요한 꼬리 여유가 0.48 m 라, 2 x 3 m 목업에서는
    # 사실상 매번 걸려 조향을 못 넣었다(2026-08-10 실측 rearLeft/rearRight
    # 0.288~0.627). 21° 면 다음 전진의 접근각을 바꾸기에 충분하다.
    escape_steer_sec: 1.2
    # 위 예산(0.36 rad)에서 후방 바깥 모서리가 약 0.40 m 까지 나간다.
    # 스캔 잡음 여유를 더해 0.42. 예산을 늘리면 이 값도 같이 올려야 한다.
    escape_tail_clearance_m: 0.42
    # 직선 이탈에 스톨 킥이 두 번(2.0 + 쉼 1.0 + 2.0) 필요할 수 있고, 그 뒤에
    # 조향 2.0 초가 붙는다.
    max_reverse_sec: 7.0
    # 뒤가 이보다 가까워지면 탈출을 접는다. 노드 기본값은 0.45 인데 2 x 3 m
    # 목업에는 과하다 -- 2026-08-10 실측에서 세 번의 탈출이 전부 "뒤가 0.44~
    # 0.45 m 로 가까워졌다" 로 끝나, **조향이 들어갈 시간 자체가 없었다.**
    # 후진 샘플 58개 중 꺾인 값은 10980 하나뿐이었고, 서보가 그 각까지 가는 데
    # 필요한 0.6 초(steering_settle_sec)도 못 채웠다.
    #
    # 필요한 후진 거리: 직선 이탈 약 0.10 m + 조향 2.0 초 x 0.12 m/s = 0.24 m.
    # 뒤 0.75 m 에서 출발해 0.38 에서 멈추면 0.37 m 라 그 예산이 나온다.
    #
    # ⚠️ **충돌을 막는 것은 이 값이 아니다.** 가드의 rear_stop_distance_m
    #    0.35(차체 뒤끝 0.245 + 여유 0.010 + 제동 0.087)가 그 역할을 하고,
    #    여기는 "이쯤에서 곱게 접고 넘긴다" 는 선이다. 0.38 은 그 위 3 cm.
    rear_limit_m: 0.38

    vision_confidence_threshold: 0.60
    dynamic_object_stop_distance_m: 1.50
    dynamic_labels: [person, pedestrian, forklift, vehicle, car, truck]
