obstacle_avoidance:
  ros__parameters:
    base_frame_id: base_link
    input_cmd_vel_topic: /cmd_vel
    output_cmd_vel_topic: /cmd_vel_safe

    # Roof-mounted 360-degree YDLIDAR.
    scan_topic: /scan
    # Both ToFs face forward at fork level. "left/right" means mounting
    # position, not a side-looking sensor orientation.
    front_tof_topics: ["/tof/left/points", "/tof/right/points"]
    vision_topic: /camera/obstacles
    status_topic: /obstacle_avoidance/status

    control_rate_hz: 20.0
    command_timeout_sec: 0.5
    sensor_timeout_sec: 0.5
    vision_timeout_sec: 0.5
    require_roof_lidar: true
    require_both_front_tof: true
    # Existing onboard model detects pallet/hole only. Enable this after a
    # person/vehicle detector publishes the documented JSON contract.
    require_vision: false

    lidar_front_half_angle_deg: 70.0
    lidar_center_half_angle_deg: 18.0
    tof_front_half_angle_deg: 35.0
    # Applied after ToF points are transformed into base_link. This removes
    # floor returns while retaining low obstacles between/around the forks.
    tof_min_height_m: 0.02
    tof_max_height_m: 0.80
    minimum_sector_hits: 2

    # base_link 기준이다. 사용자 현장 충돌 방지 조치와 명시적 승인 하에 0.25m.
    # footprint 전면 x=0.190m 대비 차체 여유는 0.06m다.
    # 0.25 -> 0.26 (tools/geometry_limits.py --speed 0.10).
    # 앞끝 0.190 + 패딩 0.010 + 제동 0.055 = 0.255. 0.25 는 5 mm 모자랐다.
    stop_distance_m: 0.26
    # 이 거리 **아래에서만** 가드가 조향에 개입한다. 여기부터 감속 시작
    # 거리(1.00) 사이에서는 감속만 하고 조향은 Nav2 에 맡긴다.
    #
    # 예전엔 감속대 전체에서 개입했다. 편향 0.15 rad/s 가 Nav2 가 실제로 내는
    # 0.03~0.12 보다 커서 더하면 조향이 **뒤집힌다.** 2026-08-07 실측에서
    # 15회 중 9회가 반대로 뒤집혔고, 후륜 조향이 좌우로 계속 흔들려 차가 한
    # 방향으로 힘을 실어 본 적이 없다 -- 정지마찰을 못 이긴 직접 원인.
    avoidance_engage_distance_m: 0.45
    # 전방 ToF 를 좌/중/우 방위 구간으로 가르는 중앙 구간 반각.
    # 이게 생기기 전엔 센서당 값 하나였고, 두 센서가 같은 앞을 보므로 값이
    # 거의 같아 좌우 판단이 **항상** LiDAR 로 떨어졌다 -- 포크 높이를 못 보는
    # 센서로 포크 높이 회피를 결정하고 있었다.
    tof_center_half_angle_deg: 12.0
    slowdown_distance_m: 1.00
    # 0.25배 + 0.18rad/s는 실측 Nav2 저속에서 PWM 유지 토크가 부족하고
    # 뒷바퀴가 36도 한계에 포화됐다. 전진 토크를 유지하면서 Nav2 조향에 작은
    # 좌/우 보정만 더한다. stop_distance_m 정지는 이 값과 무관하게 즉시 0이다.
    # ⚠️ **이 차에서 점진 감속은 명목상으로만 존재한다** (2026-08-07 실측).
    #
    # 안정 최저 속도가 0.078 m/s 라, 가드가 0.035 로 낮춰도 차는 0.078 로 간다.
    # 정지는 정상이다(0 명령이면 선다) -- 못 하는 것은 "천천히 가기" 뿐이다.
    # 정지거리는 상한 0.10 기준으로 유도했으므로 제동 여유 자체는 유효하다.
    #
    # 이 값을 낮춰 더 감속시키려 해도 소용없다. 실제로 느리게 가려면 구동계를
    # 바꾸거나(감속비·전압) 듀티를 PWM 처럼 끊어 써야 하는데, 후자는 지금
    # 하한 8% 시험에서 3초에 7번 끊기는 것으로 확인됐다.
    minimum_speed_scale: 0.80
    # ⚠️ 0.02 는 회피가 아니라 미세 보정이었다. 0.08 m/s 에서 곡률 0.25 →
    #    후륜 2.06° → 반경 4.0 m 다. 0.25~1.00 m 구간을 9.4초에 지나며 얻는
    #    헤딩 변화가 10.8° 뿐이라 장애물을 못 비켜났다.
    #
    #    0.15 는 0.08 m/s 에서 곡률 1.875 → 후륜 15.1° → 반경 0.53 m 다.
    #    기계 한계 36° 의 42% 라 포화 여유가 있다. Nav2 조향에 더해지는
    #    편향이고 max_abs_yaw_rate_rps 로 잘린다.
    avoidance_yaw_rate_rps: 0.15
    max_abs_yaw_rate_rps: 0.35
    tof_imbalance_m: 0.10
    lidar_clearance_margin_m: 0.15
    # 이 값 이상 비어 있어야 그쪽으로 틀 수 있다. 0.55 는 폭 2 m 경기장에서
    # **어느 지점에서도 통과할 수 없었다** — 주행 레인 x=0.50 의 벽 여유가
    # 0.426 m, x=1.55 는 0.376 m 다. 그래서 _choose_turn 이 항상 SLOW 를
    # 돌려주었고 가드는 애초에 조향할 수 없는 상태였다.
    # 0.30 -> 0.38 (2026-08-07, tools/geometry_limits.py).
    #
    # 0.30 은 **꼬리 휨을 안 넣은 값**이었다. 후륜 조향차가 최소반경 0.198 m 로
    # 돌면 바깥 뒷모서리가 0.380 m 를 휩쓴다 -- 회전반경보다 0.182 m 더 나간다.
    # 앞이 지나갈 수 있다고 보고 회전을 시작하면 뒤가 걸린다.
    minimum_turn_clearance_m: 0.38
    # 360도 상부 LiDAR의 후방 ±18도 통로. 자동 후진 복구 중 이 거리에서 정지.
    # 뒤끝 0.245 + 패딩 0.010 + 제동 0.055 = 0.310.
    rear_stop_distance_m: 0.31

    vision_confidence_threshold: 0.60
    dynamic_object_stop_distance_m: 1.50
    dynamic_labels: [person, pedestrian, forklift, vehicle, car, truck]
