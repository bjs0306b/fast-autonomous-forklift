uart_teleop_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    serial_port: /dev/ttyTHS1
    baud_rate: 115200
    command_rate_hz: 20.0
    command_timeout_sec: 0.5
    max_linear_mps: 0.20
    max_angular_rps: 0.35
    linear_deadband_mps: 0.01
    wheelbase_m: 0.144
    # ⚠️ 15.0 → 30.0 (2026-08-04). 조향 원점·범위를 다시 잡았다. 이 값은 **아래
    #    steering_min/max 로 표현 가능한 각도와 일치**해야 한다 — 어긋나면
    #    포화 지점이 어긋나 `turn_ratio` 가 1.0 에 못 미친 채 최대 조향을 냈다고
    #    착각한다. 아래 steering_min/max 가 ±30° 이므로 여기도 30.0 이다.
    # ⚠️ 30.0 → 28.0 (2026-08-04 오후). 중립이 9600 → 9400 으로 내려가면서
    #    좌우 가동폭을 대칭으로 다시 잡았다(아래 참조). 이 값은 steering_min/max
    #    로 표현 가능한 각도와 **같아야** 한다 — 어긋나면 포화 지점이 어긋나
    #    turn_ratio 가 1.0 에 못 미친 채 최대 조향을 냈다고 착각한다.
    rear_steering_limit_deg: 28.0
    # 구동 PWM 범위 — 2026-08-04 실측 (S15P11A304-198).
    #
    # 종전 50~60 은 재본 값이 아니었다. 폭이 10%p 뿐이라 `linear.x` 가 어떤
    # 값이든 사실상 한 가지 속도로 뭉개졌고, 그래서 포크 정렬 ALIGN 속도를
    # 0.06 → 0.02 로 낮춰도 **거동이 전혀 안 변했다.**
    #
    # 실측 방법: min=max=N 으로 고정해 두고 정지 상태에서 2.0초 전진, 줄자.
    # 유지 속도는 킥(55% 0.6초) 뒤 유지 시간만 2.0/4.0초로 바꿔 차이로 뽑았다.
    #
    #   drive |  출발(정지→)  |  유지 속도
    #   ------+---------------+------------
    #    30%  |  안 됨        |  **못 구름** (킥으로 굴려도 3초 안에 멎음)
    #    35%  |  안 됨        |  0.070 m/s
    #    38%  |  안 됨(스톨)  |  -
    #    40%  |  **반반**     |  -
    #    41%  |  -            |  0.138 m/s
    #    50%  |  됨           |  0.178 m/s (정지출발 3.0초 535mm, 기동 포함 평균)
    #
    # ⚠️ **출발 문턱과 유지 문턱이 다르다.** 정지마찰이 운동마찰보다 커서,
    #    한 번 굴러가면 35% 로도 계속 가지만 그 값으로는 출발을 못 한다.
    #    38% 는 소리만 나고 안 도는 **스톨**이었다(전류가 전부 열이 된다).
    #
    # ⚠️ **문턱은 값 하나가 아니라 확률 구간이다.** 40% 는 같은 조건에서
    #    갔다 안 갔다 했다 — 모터 회전자 정지 각도(코깅)·기어 백래시·배터리
    #    전압·발열이 매번 다르다. 그래서 **경계값을 그대로 쓰면 안 된다.**
    #
    # 35 로 정한 근거: 시퀀스가 정지에서 출발할 때는 항상 APPROACH 의
    # CRUISE_SPEED(0.12)부터 시작하고, 그건 이 범위에서 50% 로 매핑돼 출발이
    # 보장된다. 35 는 **이미 굴러가는 중에만 쓰이는 하한**이다.
    #
    # ⚠️ 그래서 ALIGN 도중 무언가에 걸려 멎으면 **스스로 못 출발한다.**
    #    카메라 거리가 안 줄어드는 것으로 감지해야 한다 — 아직 없다.
    #
    # ⚠️ 상한 60 은 펌웨어 config.h 의 TELEOP_MAX_DRIVE_PERCENT 와
    #    protocol.py 가 같이 막고 있다. 더 올리려면 **ESP32 재플래시**가 필요해
    #    이번엔 손대지 않았다. 하한만 내려도 폭이 10%p → 25%p 로 넓어진다.
    min_drive_percent: 35
    max_drive_percent: 60
    # 조향 원점 — 서보 각도(cdeg = 도 × 100). 2026-08-04 실측으로 이동했다.
    #
    # ⚠️ **서보 원점(100°)은 직진이 아니다. 실측 직진은 96°(9600) 다.**
    #    서보 혼이 스플라인에 약 4° 틀어져 끼워져 있다. 각도를 올릴수록 왼쪽으로
    #    꺾이므로 직진은 100° 아래에 있고, 96° 에서 곧게 펴지는 것을 확인했다.
    #    혼을 다시 끼우는 대신 설정으로 옮겼다.
    #
    # 종전 값(center 10000)으로 두면 **오른쪽으로 아예 못 꺾는다** — 직진이 이미
    # 상한(11500)이라 그 위가 없다. 그러면 fork_align 이 좌우 오차를 한 방향으로만
    # 지울 수 있어 정렬이 수렴하지 않는다(S15P11A304-197).
    #
    #   [종전]  8500 ────── 10000 ────── 11500
    #           ?           좌회전최대     직진        ← 직진이 끝에 몰림
    #
    # 조향 원점 — 서보 각도(cdeg = 도 × 100). **2026-08-04 실측** (S15P11A304-197).
    #
    # ⚠️ **서보 원점(100°)은 직진이 아니다. 실측 직진은 96°(9600) 다.**
    #    서보 혼이 스플라인에 약 4° 틀어져 끼워져 있다. 각도를 올릴수록 왼쪽으로
    #    꺾이므로 직진은 100° 아래에 있다 — 96° 에서 곧게 펴지는 것을 확인했다.
    #
    #   [종전]  8500 ────── 10000 ────── 11500     중립이 이미 좌 4°
    #   [지금]  6600 ──── 9600 ──── 12600          직진 96°, 좌우 ±30°
    #
    # 🔗 **펌웨어 config.h 의 TELEOP_STEERING_* 와 같은 값이어야 한다.**
    #    한쪽만 바꾸면 조용히 안 먹거나(펌웨어가 좁을 때) 브리지가 죽는다
    #    (여기가 좁을 때). protocol.py 의 STEERING_MIN/MAX_CDEG 도 같이 맞춘다.
    #    ⚠️ **ESP32 재플래시를 해야 실제로 반영된다.**
    #
    # ⚠️ **±30° 는 기구 한계를 재서 정한 값이 아니다.** 전원을 끄고 손으로 재는
    #    방법이 부정확해 일단 넓게 잡았다. 링키지가 못 가면 서보가 스톨해 전류·
    #    발열이 오르고 기어가 상할 수 있다. **첫 시험은 지게차를 들고**, 양 끝에서
    #    소리·떨림이 나면 즉시 멈추고 이 값을 줄일 것.
    #
    # ⚠️ 서보를 교체하거나 혼을 다시 끼우면 **이 값을 다시 재야 한다.**
    #    확인법: 명령을 주지 않으면 워치독이 중립을 유지한다 — 그때 바퀴가 직진이면 맞다.
    # ⚠️ **2026-08-04 오후 재실측: 9600 → 9400.**
    #
    # 197 의 9600 은 **차를 세워두고 눈으로** 바퀴가 곧은지 본 값이었다. 실제로
    # 주행시켜 재보니 3.0초(535mm)에 **왼쪽으로 40mm** 밀렸다 — 반경 3.58m
    # 원호이고 뒷바퀴가 약 2.31° 틀어져 있었다는 뜻이다. 눈대중으로는 2° 를
    # 못 본다.
    #
    #   중립   전진거리   좌우편차
    #   9600    535mm      40mm 왼쪽    ← 197 의 값
    #   9400    565mm       9mm 왼쪽
    #   9350    525mm       7mm 왼쪽    ← 9400 과 사실상 같음(노이즈 바닥)
    #
    # 9350 이 더 낫지 않으므로 9400 으로 둔다. 남은 0.45° 는 서보 중립이 아니라
    # 바퀴 정렬·바닥 쪽이다 — 중립을 더 옮겨도 안 준다.
    #
    # ⚠️ 편차는 거리의 **제곱**으로 커진다. 짧게 재면 안 보인다 — 같은 날 오전
    #    315mm 런에서는 8mm 오른쪽이 나와 "계통 편향 없음" 으로 오판했다.
    #    3.0초(50cm 이상) 이상으로 재고, 값은 거리제곱으로 정규화해 비교할 것.
    #
    # 🔗 펌웨어 config.h 의 TELEOP_STEERING_CENTER_CDEG 는 아직 9600 이다.
    #    거기 값은 **부팅·워치독 정지 시의 중립 자세**에만 쓰이고, 주행 중
    #    조향각은 브리지가 매 프레임 명시적으로 보내므로 지금 동작은 맞다.
    #    다음에 ESP32 를 플래시할 때 9400 으로 같이 맞출 것.
    steering_center_cdeg: 9400
    # 중립이 200 내려갔으므로 좌우 폭을 **대칭**으로 다시 잡는다(각 2800 = 28°).
    # 그대로 6600/12600 을 두면 좌 28° · 우 32° 로 비대칭이 되어, turn_ratio 1.0
    # 이 방향에 따라 다른 실제 각도를 뜻하게 된다.
    # 펌웨어 허용 범위(6600~12600)보다 좁으므로 재플래시는 필요 없다.
    steering_min_cdeg: 6600
    steering_max_cdeg: 12200
