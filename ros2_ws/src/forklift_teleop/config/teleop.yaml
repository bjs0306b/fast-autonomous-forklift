uart_teleop_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    serial_port: /dev/ttyTHS1
    baud_rate: 115200
    command_rate_hz: 20.0
    command_timeout_sec: 0.5
    max_linear_mps: 0.20
    max_angular_rps: 0.35
    linear_deadband_mps: 0.01
    wheelbase_m: 0.144
    rear_steering_limit_deg: 15.0
    min_drive_percent: 50
    max_drive_percent: 60
    # 조향 원점 — 서보 각도(cdeg = 도 × 100). 2026-08-04 실측으로 이동했다.
    #
    # ⚠️ **100° 는 직진이 아니라 좌회전 최대다.** 서보 혼이 스플라인에 틀어져
    #    끼워져 있어 기구 원점과 서보 원점이 약 15° 어긋나 있다. 혼을 다시 끼워도
    #    스플라인 눈금(약 1.4°/칸)으로는 딱 맞출 수 없어 설정으로 옮겼다.
    #
    # 종전 값(center 10000)으로 두면 **오른쪽으로 아예 못 꺾는다** — 직진이 이미
    # 상한(11500)이라 그 위가 없다. 그러면 fork_align 이 좌우 오차를 한 방향으로만
    # 지울 수 있어 정렬이 수렴하지 않는다(S15P11A304-197).
    #
    #   [종전]  8500 ────── 10000 ────── 11500
    #           ?           좌회전최대     직진        ← 직진이 끝에 몰림
    #
    # 🔴 **원점 이동은 소프트웨어만으로 안 된다 — 되돌렸다.**
    #
    # 11500/10000/13000 으로 옮겼더니 브리지가 죽었다:
    #
    #     protocol.py: ValueError: steering_cdeg must be between 8500 and 11500
    #
    # 같은 8500~11500 상한이 **네 곳**에 박혀 있다:
    #   ① mapping.py  TeleopLimits.validate()      (넓혔음)
    #   ② protocol.py encode_command()             ← 여기서 죽었다
    #   ③ 펌웨어 config.h  TELEOP_STEERING_MIN/MAX_CDEG
    #   ④ 펌웨어 task_comm.c / task_motor.c 의 검증
    #
    # ③④ 는 **ESP32 재빌드·플래시**가 필요하다. 시연 주간에 펌웨어를 건드리는 것은
    # 위험 대비 실익이 없어 원상 복구한다.
    #
    # ⚠️ 그래서 **오른쪽으로 못 꺾는 문제가 그대로 남아 있다**(S15P11A304-197).
    #    근본 해결은 서보 혼을 기구적으로 다시 끼워 100° 가 직진이 되게 하는 것이다.
    #    스플라인 한 칸이 약 1.4° 라 완벽하진 않아도 범위 안으로는 들어온다.
    steering_center_cdeg: 10000
    steering_min_cdeg: 8500
    steering_max_cdeg: 11500
