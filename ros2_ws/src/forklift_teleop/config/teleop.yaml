uart_teleop_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    serial_port: /dev/ttyTHS1
    baud_rate: 115200
    command_rate_hz: 20.0
    command_timeout_sec: 0.5
    # 35~41%는 구르는 차량을 유지하지만 정지마찰을 이기지 못한다. 0→전진
    # 전환 때만 실측상 출발이 보장된 50%를 잠깐 적용한다. /cmd_vel_safe가 0이
    # 되는 즉시 취소되므로 obstacle_avoidance의 정지 권한은 그대로 유지된다.
    forward_startup_kick_percent: 50
    # ⚠️ **후진은 훨씬 큰 값이 필요하다** (2026-08-05 실측). 뒷바퀴 조향차가
    #    후진하면 조향륜이 앞장서서 바닥을 옆으로 긁는다. 45° 파렛트 재접근에서
    #    60% 로는 5초간 한 발도 못 갔고, 100% 에서야 126mm 물러났다.
    #
    #    Nav2 의 BackUp 복구가 정지 상태에서 후진을 명령하므로 이 킥이 없으면
    #    복구 동작이 그냥 안 움직인다.
    reverse_startup_kick_percent: 100
    # ⚠️ **곧게 후진할 때는 60% 면 된다.** 위 100% 근거는 45° 꺾인 재접근이다.
    #    Nav2 의 BackUp 복구는 `angular.z = 0` 이라 조향이 중립인데, 거기에
    #    100% 를 물리면 요청한 0.08 m/s 를 0.3초간 통째로 덮어써서 튀어나간다.
    #    조향이 중립 ±3° 안이면 이 값을, 아니면 위 값을 쓴다.
    reverse_startup_kick_straight_percent: 60
    # 조향 명령이 중립으로 바뀐 뒤 서보가 실제로 도달할 때까지 기다린다.
    # 그 전에는 할인(위 값)을 안 쓰고 꺾인 후진 값을 쓴다 -- 회전 직후에는
    # 명령만 중립이고 바퀴는 아직 꺾여 있기 때문이다.
    steering_settle_sec: 0.6
    # 근접 회피 출발에서 초기 급진입 거리를 줄인다.
    forward_startup_kick_sec: 0.3
    # 엔코더로 "명령은 나가는데 안 구른다" 를 보고 킥을 **연장**한다.
    #
    # 고정 0.3초는 출발에 걸리는 시간을 찍은 값이고, 틀린 값이었다. 좁은 회피
    # 에서 Nav2 는 0.037 m/s 까지 줄이는데 그건 출발 가능 듀티 아래라, 0.3초가
    # 끝나는 시점까지 차가 안 움직였고 그 뒤로도 영영 안 움직인다.
    #
    # max_stall_kick_sec 는 벽에 밀착된 차가 정지한 모터에 계속 전류를 밀어
    # 넣지 않게 하는 상한이다.
    wheel_twist_topic: /wheel/twist
    stall_speed_mps: 0.01
    max_stall_kick_sec: 2.0
    # 밀고-쉬고를 반복한다. 한 번 밀어 보고 포기하면 창을 놓쳤을 때 영영 못
    # 뜬다 -- 2026-08-07 에 완전 조향 출발에서 2초 창을 놓쳐 22초를 그대로
    # 보냈다. 쉬는 구간이 있어 평균 전류는 계속 미는 것보다 낮다.
    stall_kick_rest_sec: 1.0

    # 엔코더 닫힌 루프 -- 명령 속도와 실측 속도의 차이를 적분해 듀티를 보정한다.
    #
    # 적분만 쓴다. 정지마찰은 이득이 아니라 문턱이라, 멈춰 있는 동안 오차가
    # 그대로 남아 적분이 문턱을 넘을 때까지 듀티를 올리고, 구르기 시작하면
    # 저절로 내려온다. 비례항은 멈춘 차에 일정 오프셋만 더할 뿐 도달하지 못한다.
    #
    # 부호는 안 쓰고 크기만 본다 -- 엔코더 방향이 아직 미검증이고, 여기서
    # 제어하는 것은 "바퀴가 얼마나 빨리 도는가" 뿐이다.
    speed_control_enabled: true
    speed_percent_per_mps_second: 500.0
    speed_max_bias_percent: 40

    # 회전 속도 배수 -- **조향각의 함수가 아니라 시간에 따라 쌓인다.**
    #
    # 조향각에 고정한 배수는 모양이 틀렸다. 작게 잡으면 회전을 못 빠져나오고,
    # 통하게 키우면 바퀴가 중립을 벗어나는 순간 이미 크다. 중요한 건 얼마나
    # 꺾였느냐가 아니라 **꺾은 채 얼마나 오래 못 돌고 있었느냐**다.
    #
    # 선속도와 각속도에 같은 배수를 건다. 곡률은 둘의 비이므로 조향각은
    # 그대로고, 같은 호를 더 빨리 지날 뿐이다. 선속도만 올리면 곡률이 줄어
    # 바퀴가 펴진다 -- 회전이 안 되는 상황에서 정반대다.
    #
    # ⚠️ 결과는 max_linear_mps(0.10) 에서 잘린다. 그 값이 정지거리를 유도한
    #    기준이므로, 가드의 감속 여유는 쓸 수 있어도 제동 여유는 못 넘는다.
    turn_boost_gain_per_second: 0.8      # 초당 배수 증가
    # ⚠️ 풀릴 때는 **감쇠가 아니라 즉시 1.0** 이다. 이 값은 지금 안 쓰인다.
    #    감쇠로 두면 바퀴가 물린 뒤에도 몇 십 분의 일 초 동안 계속 과속하고,
    #    그 여분의 요각이 목표 각도를 지나치게 한다. 여분의 속도는 안 도는
    #    회전을 뚫으라고 있는 것이라, 돌기 시작한 순간 할 일이 없다.
    turn_boost_decay_per_second: 2.0
    turn_boost_max_multiplier: 2.5
    turn_boost_engage_ratio: 0.25        # 이만큼 꺾여야 '회전 중'으로 본다
    # 0.20 -> 0.10 -> 0.15 (2026-08-07). tools/geometry_limits.py 로 유도한다.
    #
    # 0.10 은 너무 느렸다. 안정 최저 속도가 0.078 m/s 라 쓸 수 있는 폭이
    # 0.078~0.10 밖에 안 됐고, 그 안에서는 컨트롤러가 하한 근처에서 헌팅한다.
    #
    # ⚠️ 느린 것이 **더 안전하지 않다.** 관성이 없어 쉽게 멈추고, 한 번 멈추면
    #    뒷바퀴가 꺾인 채로 서게 되는데 그 상태에서는 85% 를 끊어서 밀어도
    #    출발하지 못한다(2026-08-07 실측, 17초 연속 정지). 회전을 못 빠져나오는
    #    차는 결국 사람이 들어서 옮겨야 한다.
    #
    # ⚠️ 0.15 -> 0.40 (2026-08-07). **이 값은 희망이 아니라 실측이어야 한다.**
    #
    # 매핑이 이 값을 기준으로 duty 를 정하므로, 실제보다 작으면 낮은 속도를
    # 명령해도 곧장 최대 duty 가 나간다. 0.15 로 두었을 때 0.15 명령이 75% 를
    # 받아 **0.397 m/s 로 튀어나갔고**, 닫힌 루프가 4초에 걸쳐 되돌렸다.
    # 상한 75% 에서 실측 최고가 0.40 이므로 그 값을 넣는다 -- 이제 0.15 명령은
    # 50% 로 가고 오버슛이 크게 줄어든다.
    #
    # 상한 duty(max_drive_percent)를 바꾸면 이 값도 다시 재야 한다. 둘은 같은
    # 하나의 사실 -- "최대 duty 에서 몇 m/s 가 나오는가" -- 를 표현한다.
    max_linear_mps: 0.40
    # ⚠️ 0.35 → 0.75 (2026-08-05). **이 값이 조향각을 기계 한계 아래로 자르고
    #    있었다.** map_twist 는 곡률(= angular_z / linear_x)로 뒷바퀴각을 내므로,
    #    같은 angular_z 라도 빠를수록 덜 꺾인다:
    #
    #      속도    angular 0.35 일 때 뒷바퀴각     한계를 다 쓰려면 필요한 angular
    #      0.06        40° → 한계로 포화             0.303  (36° 기준)
    #      0.12        22.8°                          0.605
    #      0.20        14.1°                          1.009
    #
    #    후진(0.12)에서 한계를 다 쓰려고 0.75 로 올렸다 — 0.605 를 덮는다.
    #
    # ⚠️ **"최고 속도에서도 한계까지 낼 수 있다"는 말은 이제 틀리다**(2026-08-06 정정).
    #    위 표는 원래 한계 28° 로 계산돼 있었고 그때는 0.20 에서 0.738 이라 0.75 로
    #    딱 덮였다. 08-05 에 펄스 범위를 고쳐 한계가 **36°** 가 되면서 필요값이
    #    1.009 로 올라갔다 — 지금 0.75 는 0.20 m/s 에서 **28.4° 에서 포화**한다.
    #
    #    정렬에는 영향이 없다(ALIGN 0.06 · 후진 0.12 는 전부 덮이고, 전진은 어차피
    #    fork_servo 의 MAX_ANGULAR 0.35 가 먼저 자른다). 영향을 받는 것은 **고속
    #    수동 주행과 Nav2 가 큰 조향을 요구할 때**뿐이다. 그때 한계까지 쓰려면 1.05
    #    이상으로 올려야 하는데, 그러면 저속 구간의 명령 해상도가 나빠지므로
    #    **필요해질 때 재기로 하고 지금은 0.75 를 유지한다.**
    #
    # ⚠️ **상한을 올린 것이지 명령을 키운 것이 아니다.** 전진 조향은 fork_servo 의
    #    MAX_ANGULAR(0.35)이 그대로 자르므로 거동이 안 바뀐다. 후진만
    #    RETREAT_MAX_ANGULAR(0.60)로 더 쓴다.
    max_angular_rps: 2.50
    linear_deadband_mps: 0.01
    wheelbase_m: 0.144
    # ⚠️ 15.0 → 30.0 (2026-08-04). 조향 원점·범위를 다시 잡았다. 이 값은 **아래
    #    steering_min/max 로 표현 가능한 각도와 일치**해야 한다 — 어긋나면
    #    포화 지점이 어긋나 `turn_ratio` 가 1.0 에 못 미친 채 최대 조향을 냈다고
    #    착각한다. 아래 steering_min/max 가 ±30° 이므로 여기도 30.0 이다.
    # ⚠️ 30.0 → 28.0 (2026-08-04 오후). 중립이 9600 → 9400 으로 내려가면서
    #    좌우 가동폭을 대칭으로 다시 잡았다(아래 참조). 이 값은 steering_min/max
    #    로 표현 가능한 각도와 **같아야** 한다 — 어긋나면 포화 지점이 어긋나
    #    turn_ratio 가 1.0 에 못 미친 채 최대 조향을 냈다고 착각한다.
    # ⚠️ 28.0 → 36.0 (2026-08-05). 아래 5400~12600 과 짝이다. 펌웨어 펄스 범위를
    #    고쳐(1000~2000 → 500~2500) 서보 가동폭이 두 배가 된 뒤, 실물에서 ±36°
    #    까지 스톨 없이 도는 것을 확인하고 넓혔다.
    # ⚠️ 36 -> 58 (2026-08-08). 36도는 **너무 얕았다.** 회전반경 0.198 m 로는
    #    목업 아래쪽 띠(높이 0.7 m)에서 90도 선회를 완성할 공간이 없어, 차가
    #    좌우로만 왕복하며 y 방향으로 나가지 못했다. 58도면 0.090 m 다.
    #
    #    60도로 안 간 이유는 펌웨어 주석 참고 -- 서보 물리 한계(30~150도)에
    #    정확히 닿아 스톨 위험이 있다. 2도를 여유로 남겼다.
    #
    # ⚠️ 이 값과 steering_min/max_cdeg 는 **짝이다**(1도 = 100 cdeg). 한쪽만
    #    바꾸면 조향값이 실제 바퀴각과 어긋난다.
    rear_steering_limit_deg: 58.0
    # 구동 PWM 범위 — 2026-08-04 실측 (S15P11A304-198).
    #
    # 종전 50~60 은 재본 값이 아니었다. 폭이 10%p 뿐이라 `linear.x` 가 어떤
    # 값이든 사실상 한 가지 속도로 뭉개졌고, 그래서 포크 정렬 ALIGN 속도를
    # 0.06 → 0.02 로 낮춰도 **거동이 전혀 안 변했다.**
    #
    # 실측 방법: min=max=N 으로 고정해 두고 정지 상태에서 2.0초 전진, 줄자.
    # 유지 속도는 킥(55% 0.6초) 뒤 유지 시간만 2.0/4.0초로 바꿔 차이로 뽑았다.
    #
    #   drive |  출발(정지→)  |  유지 속도
    #   ------+---------------+------------
    #    30%  |  안 됨        |  **못 구름** (킥으로 굴려도 3초 안에 멎음)
    #    35%  |  안 됨        |  0.070 m/s
    #    38%  |  안 됨(스톨)  |  -
    #    40%  |  **반반**     |  -
    #    41%  |  -            |  0.138 m/s
    #    50%  |  됨           |  0.178 m/s (정지출발 3.0초 535mm, 기동 포함 평균)
    #
    # ⚠️ **출발 문턱과 유지 문턱이 다르다.** 정지마찰이 운동마찰보다 커서,
    #    한 번 굴러가면 35% 로도 계속 가지만 그 값으로는 출발을 못 한다.
    #    38% 는 소리만 나고 안 도는 **스톨**이었다(전류가 전부 열이 된다).
    #
    # ⚠️ **문턱은 값 하나가 아니라 확률 구간이다.** 40% 는 같은 조건에서
    #    갔다 안 갔다 했다 — 모터 회전자 정지 각도(코깅)·기어 백래시·배터리
    #    전압·발열이 매번 다르다. 그래서 **경계값을 그대로 쓰면 안 된다.**
    #
    # 35 로 정한 근거: 시퀀스가 정지에서 출발할 때는 항상 APPROACH 의
    # CRUISE_SPEED(0.12)부터 시작하고, 그건 이 범위에서 50% 로 매핑돼 출발이
    # 보장된다. 35 는 **이미 굴러가는 중에만 쓰이는 하한**이다.
    #
    # ⚠️ 그래서 ALIGN 도중 무언가에 걸려 멎으면 **스스로 못 출발한다.**
    #    카메라 거리가 안 줄어드는 것으로 감지해야 한다 — 아직 없다.
    #
    # ⚠️ 상한 60 은 펌웨어 config.h 의 TELEOP_MAX_DRIVE_PERCENT 와
    #    protocol.py 가 같이 막고 있었다. 2026-08-05 에 봉투를 100 으로 넓혔으므로
    #    이제 재플래시 없이 조절된다(전진 60 유지 · 후진은 위 항목 참조).
    # ⚠️ 2026-08-07: 한때 18/45 로 내려가 있었다. 두 가지가 동시에 깨진다 —
    #    (1) forward_startup_kick_percent 50 이 [min, max] 밖이라
    #        uart_teleop_bridge 가 생성자에서 ValueError 로 죽는다.
    #    (2) 18/45 면 Nav2 순항 0.10 m/s 가 32% 로 매핑되는데, 위 실측표의
    #        30% 는 "못 구름" 이다. 어떤 속도를 명령해도 차가 안 움직인다.
    #    킥 값을 바꿀 때는 이 범위 안에 있는지 반드시 확인할 것.
    min_drive_percent: 35
    # 구르는 것을 **유지**하는 최소 듀티. 위 값은 출발용이다.
    #
    # 2026-08-07 실측: 바닥에서 35% 로 0.170 m/s 가 나왔다. 목표가 0.08 인데
    # 듀티가 35 아래로 못 내려가서 두 배로 갔다. 출발은 SpeedController 적분과
    # StartupKick 이 맡으므로, 구르기 시작하면 여기까지 내려갈 수 있어야 한다.
    #
    # ⚠️ 너무 낮으면 주행 중에 멈춰서 출발을 다시 해야 하고, 그러면 가다 서다를
    #    반복한다. 실측으로 "구르는 것을 유지하는 최소값" 을 찾아 넣을 것.
    # 2026-08-07 실측 (3초 직진, 닫힌 루프 켠 상태):
    #
    #   15% -> 0.117 m/s · 98% 연속 · 멈춤 1회   (max_linear_mps 0.10 보다 빠름)
    #    8% -> 0.030 m/s · 82% 연속 · 멈춤 7회   (너무 낮아 헌팅)
    #
    # 8% 에서 끊기는 것은 하한이 유지 듀티 아래라서다: 멈추면 적분이 쌓여 튀고,
    # 튀면 과속이라 적분이 풀려 또 멈춘다. 정지마찰이라는 문턱 위에서 적분
    # 제어가 헌팅하는 전형이다. 하한을 **구름을 유지하는 듀티**에 정확히 두어야
    # 멎는다. 두 점 사이를 잡은 값이다.
    min_sustain_drive_percent: 12
    max_drive_percent: 75
    # 정지마찰을 이기는 **동안만** 쓰는 상한. 위 60 은 순항 상한이라 못 올린다
    # (INSERT_SPEED_ACTUAL·진입 깊이·조향 중립이 전부 60 기준).
    #
    # 2026-08-07 실측: 뒷바퀴가 36° 완전히 누운 채 출발하려는데 60 에 막혀
    # 25초간 엔코더 0.000, 회전 -2° 에서 멈췄다. 꺾인 상태에서는 조향륜이
    # 바닥을 옆으로 긁어 저항이 크게 오른다(꺾인 후진에 100% 가 필요했던 것과
    # 같은 이유).
    #
    # 85 -> 100 (2026-08-07). 85 는 근거 없이 깎은 값이었다. **실측은 100 을
    # 가리킨다** -- max_drive_percent_reverse 의 근거가 정확히 이 상황이다:
    # 45° 꺾인 재접근에서 60% 로 5초간 한 발도 못 갔고 100% 에서야 움직였다.
    # 조향륜이 바닥을 옆으로 긁는 물리는 전진이든 후진이든 같다.
    #
    # 85 에서는 완전 조향 정지 상태를 못 뚫었다(17초 연속 엔코더 0.000).
    #
    # 엔코더가 "안 구른다" 고 말하는 동안만 쓰이고, 구르기 시작하면 곧바로
    # 60 으로 돌아온다. 계속 밀지 않고 stall_kick_rest_sec 만큼 쉬었다 다시
    # 미는 것도 이 값이 크기 때문이다 -- 멈춘 모터에 100% 를 계속 넣으면 안 된다.
    max_start_drive_percent: 100
    # ⚠️ **조향각에 비례해 속도를 올린다** (2026-08-07 실측).
    #
    # 모터 토크가 약해서 크게 꺾으면 직선 주행 속도로는 안 돈다. 중립이면
    # 1.0배, 최대 조향이면 이 배수까지 실시간으로 오른다.
    #
    # ⚠️ **전역 최소 속도를 올려 해결하지 말 것.** 그렇게 하면 회전을 빠져나온
    #    직선 구간에 그 속도가 그대로 남아 과속한다 -- 실제로 그렇게 벽을
    #    받았다. 조향각으로 정하면 핸들이 펴지는 순간 배수도 1.0 이 된다.
    # 1.0 = 사실상 끔 (2026-08-07). 닫힌 루프가 들어오면서 필요 없어졌다.
    #
    # 이건 "꺾으면 더 힘이 든다" 를 **미리 추측한** 값이었다. 이제 엔코더가
    # 안 구르는 것을 직접 보고 듀티를 올리므로, 저항이 조향 때문이든 바닥
    # 때문이든 짐 때문이든 똑같이 처리된다. 추측을 실측 위에 겹치면 두 배로
    # 올라간다.
    #
    # 닫힌 루프를 끄고(speed_control_enabled: false) 쓸 일이 있으면 2.0 으로.
    steered_speed_boost: 1.0

    # ⚠️ **정지 상태에서 뒷바퀴가 완전히 누우면 못 출발한다** (2026-08-07 실측,
    #    100% 듀티까지 확인). 굴러가는 중이면 완전 조향으로도 잘 돈다.
    #
    # 그 상태는 컨트롤러가 저속에서 큰 곡률을 명령할 때 생긴다. 곡률은
    # 각속도/선속도라 선속도가 작아질수록 같은 각속도가 더 큰 조향을 만든다:
    # 0.08 m/s 에 0.35 rad/s 면 반경 0.23 m 로 거의 완전 조향이다.
    #
    # nav2 의 minimum_turning_radius 는 **경로**만 제약한다. 컨트롤러가 그 경로를
    # 따라가며 내는 순간 곡률은 제약하지 않으므로 여기서 막는다.
    #
    # ⚠️ 0.30 -> 0.20 (2026-08-08). 0.30 은 **너무 얕았다.** 목업 아래쪽 띠가
    #    높이 0.7 m 뿐이라 반경 0.30 m 로는 90도 선회를 완성할 공간이 없어,
    #    차가 좌우로만 왕복하며 y 방향으로 나가지 못했다.
    #
    #    저속에서 큰 조향으로 못 뜨는 문제는 조향을 묶는 대신 **속도를 올려**
    #    푼다. 굴러가는 중에는 완전 조향으로도 잘 돈다 -- 못 하는 것은 꺾인 채
    #    정지에서 출발하는 것 하나뿐이고, 빠르면 애초에 그 상태에 덜 빠진다.
    #
    # 0.10 은 기계 한계 0.090 바로 위다. 0 이면 끈다.
    min_command_turning_radius_m: 0.10
    # ⚠️ **후진만 상한이 다르다** (2026-08-05, S15P11A304-152).
    #
    # 근거는 **조향을 꺾은 채 후진할 때**다. 뒷바퀴 조향차는 후진 시 뒷바퀴가
    # **앞장서는데**(leading), 그게 36° 누우면 바닥을 옆으로 긁어 저항이 크게 오른다.
    # 실측: 45° 파렛트 재접근에서 60% 로는 **5초간 한 발도 못 갔고**(172→153mm,
    # 관성으로 오히려 앞으로), 100% 로 올리자 **126mm 물러나며 요각 37°→30°** 로
    # 정상 동작했다.
    #
    # ⚠️ **곧게 후진할 때는 60% 로 충분하다.** 조향이 작으면 이 상한이 안 쓰인다 —
    #    매핑이 `linear.x` 비율로 듀티를 정하므로, 필요할 때만 높은 값이 나간다.
    #
    # ⚠️ **한때 "후진이 전진의 19%" 라고 적었는데 그건 틀린 측정이었다.** 조향 한계를
    #    탐색하던 for 문이 `steering_center_cdeg` 를 11800 으로 남겨둔 채 끝나서,
    #    그 뒤 주행이 전부 **바퀴가 꺾인 상태**로 측정됐다. 중립을 되돌리자 곧은
    #    후진은 정상이었다. **값을 바꾸는 탐색 루프는 끝나면 반드시 원복할 것.**
    #
    # ⚠️ **전진 상한은 안 올린다.** INSERT_SPEED_ACTUAL · 진입 깊이 · 조향 중립이
    #    전부 전진 60% 기준이라 같이 올리면 그 값들이 무효가 된다.
    max_drive_percent_reverse: 100
    # 조향 원점 — 서보 각도(cdeg = 도 × 100). 2026-08-04 실측으로 이동했다.
    #
    # ⚠️ **서보 원점(100°)은 직진이 아니다. 실측 직진은 96°(9600) 다.**
    #    서보 혼이 스플라인에 약 4° 틀어져 끼워져 있다. 각도를 올릴수록 왼쪽으로
    #    꺾이므로 직진은 100° 아래에 있고, 96° 에서 곧게 펴지는 것을 확인했다.
    #    혼을 다시 끼우는 대신 설정으로 옮겼다.
    #
    # 종전 값(center 10000)으로 두면 **오른쪽으로 아예 못 꺾는다** — 직진이 이미
    # 상한(11500)이라 그 위가 없다. 그러면 fork_align 이 좌우 오차를 한 방향으로만
    # 지울 수 있어 정렬이 수렴하지 않는다(S15P11A304-197).
    #
    #   [종전]  8500 ────── 10000 ────── 11500
    #           ?           좌회전최대     직진        ← 직진이 끝에 몰림
    #
    # 조향 원점 — 서보 각도(cdeg = 도 × 100). **2026-08-04 실측** (S15P11A304-197).
    #
    # ⚠️ **서보 원점(100°)은 직진이 아니다. 실측 직진은 96°(9600) 다.**
    #    서보 혼이 스플라인에 약 4° 틀어져 끼워져 있다. 각도를 올릴수록 왼쪽으로
    #    꺾이므로 직진은 100° 아래에 있다 — 96° 에서 곧게 펴지는 것을 확인했다.
    #
    #   [07-31]  8500 ────── 10000 ────── 11500    중립이 이미 좌 4°
    #   [08-04]  6600 ──── 9600 ──── 12600         직진 96°, 좌우 ±30°   ← 197
    #   [08-04오후] 6600 ── 9400 ── 12200          주행 실측으로 재조정   ← 198
    #   [지금]   5400 ──── 9000 ──── 12600         직진 90°, 좌우 ±36°   ← 152(08-05)
    #
    # ⚠️ **위 두 문단은 08-04(197) 시점 기록이다.** "실측 직진은 96°(9600)" 은 그때
    #    이야기이고 **지금 중립은 9000** 이다 — 08-05 에 펌웨어 펄스 범위를 고치면서
    #    같은 cdeg 가 다른 서보 위치를 뜻하게 됐기 때문이다. 경위는 아래 08-05 절.
    #    ⚠️ 서보 혼이 4° 틀어져 끼워져 있다는 관찰 자체는 여전히 유효하다.
    #
    # 🔗 **펌웨어 config.h 의 TELEOP_STEERING_* 와 같은 값이어야 한다.**
    #    한쪽만 바꾸면 조용히 안 먹거나(펌웨어가 좁을 때) 브리지가 죽는다
    #    (여기가 좁을 때). protocol.py 의 STEERING_MIN/MAX_CDEG 도 같이 맞춘다.
    #    ⚠️ **ESP32 재플래시를 해야 실제로 반영된다.**
    #
    # ⚠️ ~~±30° 는 기구 한계를 재서 정한 값이 아니다~~ → **08-05 에 실물로 확인했다.**
    #    당시(08-04)에는 전원을 끄고 손으로 재는 방법이 부정확해 넓게 잡아둔 값이었다.
    #    지금 ±36° 는 연속 스윕으로 스톨 없이 도는 것을 확인한 값이다(아래 08-05 절).
    #    링키지가 못 가면 서보가 스톨해 전류·발열이 오르고 기어가 상하므로, **범위를
    #    더 넓힐 때는** 지게차를 들고 양 끝에서 소리·떨림을 확인하고 넣을 것.
    #
    # ⚠️ 서보를 교체하거나 혼을 다시 끼우면 **이 값을 다시 재야 한다.**
    #    확인법: 명령을 주지 않으면 워치독이 중립을 유지한다 — 그때 바퀴가 직진이면 맞다.
    # ⚠️ **2026-08-04 오후 재실측: 9600 → 9400.**
    #
    # 197 의 9600 은 **차를 세워두고 눈으로** 바퀴가 곧은지 본 값이었다. 실제로
    # 주행시켜 재보니 3.0초(535mm)에 **왼쪽으로 40mm** 밀렸다 — 반경 3.58m
    # 원호이고 뒷바퀴가 약 2.31° 틀어져 있었다는 뜻이다. 눈대중으로는 2° 를
    # 못 본다.
    #
    #   중립   전진거리   좌우편차
    #   9600    535mm      40mm 왼쪽    ← 197 의 값
    #   9400    565mm       9mm 왼쪽
    #   9350    525mm       7mm 왼쪽    ← 9400 과 사실상 같음(노이즈 바닥)
    #
    # 9350 이 더 낫지 않으므로 9400 으로 둔다. 남은 0.45° 는 서보 중립이 아니라
    # 바퀴 정렬·바닥 쪽이다 — 중립을 더 옮겨도 안 준다.
    #
    # ⚠️ 편차는 거리의 **제곱**으로 커진다. 짧게 재면 안 보인다 — 같은 날 오전
    #    315mm 런에서는 8mm 오른쪽이 나와 "계통 편향 없음" 으로 오판했다.
    #    3.0초(50cm 이상) 이상으로 재고, 값은 거리제곱으로 정규화해 비교할 것.
    #
    # ⚠️ **2026-08-05: 9400 → 9000. 펌웨어 펄스 범위를 고쳤기 때문이다.**
    #
    # 그날 `SERVO_MIN/MAX_PULSE_US` 를 1000~2000 → 500~2500 으로 고쳤다(MG996R 은
    # 500~2500 이 180°). 종전 값에서는 `servo_set_angle()` 이 내는 펄스가 절반이라
    # **같은 cdeg 가 다른 서보 위치를 뜻하게 됐다.** 그래서 중립을 다시 잡았다:
    #
    #   중립   전진거리   좌우편차   뒷바퀴각
    #   9400    580mm      50mm 왼쪽   2.45°   ← 옛 매핑의 값. 그대로 두면 이렇게 된다
    #   9200    562mm      18mm 왼쪽   0.94°
    #   9080    605mm      12mm 왼쪽   0.54°
    #   9000    630mm       8mm 왼쪽   0.33°   ← 지금. 08-04 최고치(0.45°)보다 낫다
    #   8960    635mm      28mm 왼쪽   1.15°   ← 지나쳤다
    #
    # ⚠️ **8960 에서 오른쪽으로 안 넘어가고 다시 왼쪽으로 커졌다.** 부호가 안 뒤집힌
    #    다는 것은 남은 편차가 조향 중립이 아니라는 뜻이다. 같은 5초에 간 거리가
    #    562~635mm 로 13% 흔들리는데, 08-04 기록대로 **빠를수록 왼쪽으로 더 틀어진다**
    #    (출발 토크 반작용). 비교는 **거리가 비슷한 실행끼리** 해야 한다 — 9000 과
    #    8960 이 630/635mm 로 거의 같은 속도라 그 둘의 차이는 진짜다.
    #
    # 🔗 펌웨어 config.h 의 TELEOP_STEERING_CENTER_CDEG 도 9000 이다.
    #    거기 값은 **부팅·워치독 정지 시의 중립 자세**에만 쓰이고, 주행 중
    #    조향각은 브리지가 매 프레임 명시적으로 보내므로 지금 동작은 맞다.
    #    2026-08-05 플래시로 9000 으로 맞췄다.
    steering_center_cdeg: 9000
    # 좌우 폭은 **대칭**이어야 한다. 비대칭이면 `turn_ratio` 1.0 이 방향에 따라
    # 다른 실제 각도를 뜻하게 된다.
    #
    # 2026-08-05: **5400 ~ 12600 = 중립 9000 ± 3600 = ±36° 대칭**이다.
    #
    # 중립이 9400 → 9000 으로 내려가며 한때 2400/3200 으로 비대칭이었고, 두 방법 중
    # ②를 골랐다:
    #
    #   ① 우측을 11400 으로 줄여 2400/2400 — 재플래시 불필요. 대신 이날 펄스 범위를
    #      고쳐 벌어놓은 조향 폭을 도로 깎는다. **안 골랐다.**
    #   ② 펌웨어 봉투를 4000~14000 으로 넓히고 5400/12600 으로 3600/3600.
    #      **재플래시했고**, 실물에서 ±36° 까지 스톨 없이 도는 것을 확인했다.
    #
    # ⚠️ **±36° 는 실물로 확인한 값이다.** 연속 스윕(중립 복귀 없이 서보 9819 →
    #    12600)에서 바퀴가 끝까지 따라왔다. 그 이상은 안 재봤다.
    #
    # ⚠️ 한때 "25° 에서 물리 스톱" 으로 오판했다. 실제로는 `atan` 때문에 명령이
    #    커질수록 각도 증가폭이 줄어(2.1° → 1.2°/단계) 링키지 감속까지 겹치면
    #    한 단계가 바퀴 0.6° 라 **눈에 안 보였던 것**이다. 단계별로 재시작하면
    #    워치독이 중립으로 되돌려 차이가 더 안 보인다 — **연속으로 훑을 것.**
    steering_min_cdeg: 3200
    steering_max_cdeg: 14800
