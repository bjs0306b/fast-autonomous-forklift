uart_teleop_bridge:
  ros__parameters:
    cmd_vel_topic: /cmd_vel
    serial_port: /dev/ttyTHS1
    baud_rate: 115200
    command_rate_hz: 20.0
    command_timeout_sec: 0.5
    max_linear_mps: 0.20
    max_angular_rps: 0.35
    linear_deadband_mps: 0.01
    wheelbase_m: 0.144
    rear_steering_limit_deg: 15.0
    min_drive_percent: 50
    max_drive_percent: 60
    # 조향 원점 — 서보 각도(cdeg = 도 × 100). 2026-08-04 실측으로 이동했다.
    #
    # ⚠️ **100° 는 직진이 아니라 좌회전 최대다.** 서보 혼이 스플라인에 틀어져
    #    끼워져 있어 기구 원점과 서보 원점이 약 15° 어긋나 있다. 혼을 다시 끼워도
    #    스플라인 눈금(약 1.4°/칸)으로는 딱 맞출 수 없어 설정으로 옮겼다.
    #
    # 종전 값(center 10000)으로 두면 **오른쪽으로 아예 못 꺾는다** — 직진이 이미
    # 상한(11500)이라 그 위가 없다. 그러면 fork_align 이 좌우 오차를 한 방향으로만
    # 지울 수 있어 정렬이 수렴하지 않는다(S15P11A304-197).
    #
    #   [종전]  8500 ────── 10000 ────── 11500
    #           ?           좌회전최대     직진        ← 직진이 끝에 몰림
    #
    #   [지금] 10000 ────── 11500 ────── 13000
    #          좌 15°        직진         우 15°       ← 대칭
    #
    # 서보 안전 범위는 30~150° 이므로 130° 는 여유가 있다.
    # ⚠️ 서보를 교체하거나 혼을 다시 끼우면 **이 값을 다시 재야 한다.**
    #    확인법: 명령을 주지 않으면 워치독이 중립을 유지한다 — 그때 바퀴가
    #    직진이면 맞다.
    steering_center_cdeg: 11500
    steering_min_cdeg: 10000
    steering_max_cdeg: 13000
