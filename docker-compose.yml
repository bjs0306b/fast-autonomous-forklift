services:
  mysql:
    image: mysql:8.0
    container_name: fast-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fast_backend
      MYSQL_USER: fastbackend
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fast-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - fast-mqtt_default

  frontend:
    build:
      context: ./frontend/monitoring-control-system
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ISAAC_WEBRTC_SERVER: ${NEXT_PUBLIC_ISAAC_WEBRTC_SERVER}
        NEXT_PUBLIC_ISAAC_WEBRTC_SIGNAL_PORT: ${NEXT_PUBLIC_ISAAC_WEBRTC_SIGNAL_PORT:-49100}
        NEXT_PUBLIC_ISAAC_WEBRTC_MEDIA_PORT: ${NEXT_PUBLIC_ISAAC_WEBRTC_MEDIA_PORT:-47998}
        NEXT_PUBLIC_AI_MEASUREMENT_STREAM_URL: ${NEXT_PUBLIC_AI_MEASUREMENT_STREAM_URL:-}
        # ⚠️ `NEXT_PUBLIC_*` 는 **빌드 때 코드에 박힌다.** `.env` 에만 넣고 여기 안 적으면
        # 값이 컨테이너까지 가지 않아 화면에서 조용히 빠진다(2026-08-09 실측).
        NEXT_PUBLIC_ONBOARD_STREAM_URL: ${NEXT_PUBLIC_ONBOARD_STREAM_URL:-}
    container_name: fast-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Isaac Sim 화면 스트리밍(docs/sim-streaming.md). 다른 서비스와 의존 관계가 없다 —
  # RTSP 입력은 로컬 Isaac Sim 워크스테이션의 ffmpeg 가, 재생은 브라우저가 직접 붙는다.
  # 백엔드/프론트 컨테이너는 이 서비스를 프록시하지 않는다.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: fast-mediamtx
    restart: unless-stopped
    environment:
      # WebRTC ICE candidate 에 실을 공인 IP. 없으면 브라우저가 컨테이너 내부 IP로 접속을
      # 시도해 협상이 실패한다.
      MTX_WEBRTCADDITIONALHOSTS: "3.38.178.143"
      # ⚠️ **ICE 를 TCP 로도 받는다 — 시연 망이 UDP 를 막는다.**
      # 2026-08-09 실측: 이 망에서 `3.38.178.143:8189/udp` 도, 대조군인
      # `stun.l.google.com:19302` 도 무응답이었다. UDP 자체가 나가지 않는다.
      # 그래서 WebRTC 협상이 끝나지 않고 MediaMTX 로그에 `deadline exceeded while
      # waiting connection` 만 쌓였다(성공 0회 / 실패 56회). 시그널링(8889/tcp)과
      # RTSP 입력(8554/tcp)은 TCP 라 멀쩡했기 때문에 **송출은 되는데 화면만 안 뜨는**
      # 모양이 됐다.
      MTX_WEBRTCICETCPMUXADDRESS: ":8189"
    ports:
      - "8554:8554"     # RTSP 입력 (Isaac Sim 워크스테이션 → 여기)
      - "8889:8889"     # WebRTC HTTP 재생 페이지 (브라우저 → 여기)
      - "8189:8189/udp" # WebRTC ICE (UDP — 되는 망에서는 이쪽이 빠르다)
      - "8189:8189/tcp" # WebRTC ICE (TCP 폴백 — UDP 막힌 망용)

volumes:
  mysql-data:

networks:
  default: {}
  fast-mqtt_default:
    external: true
