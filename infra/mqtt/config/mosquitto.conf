# =============================================================================
# FAST 프로젝트 로컬 개발용 Mosquitto 설정
# =============================================================================
#
# 이 파일은 "로컬 개발 전용"이다. 운영(EC2) 설정은 아래 "운영 환경" 절을 참고해
# 별도 파일로 분리해야 하며, 이 파일을 그대로 EC2에 올리면 안 된다.
#
# 컨테이너 안에서 이 파일은 /mosquitto/config/mosquitto.conf 로 마운트된다
# (infra/mqtt/docker-compose.yml 참고).
# =============================================================================

# -----------------------------------------------------------------------------
# 리스너
# -----------------------------------------------------------------------------
# 0.0.0.0 에 바인딩하는 이유: Docker 컨테이너 내부에서 127.0.0.1 에만 바인딩하면
# 호스트에서 포트를 매핑해도 접속할 수 없다. 외부 노출 범위는 mosquitto가 아니라
# docker-compose 의 포트 매핑(127.0.0.1:1883:1883)이 제한한다.
listener 1883 0.0.0.0
protocol mqtt

# -----------------------------------------------------------------------------
# 인증 — 로컬 개발 전용 설정
# -----------------------------------------------------------------------------
# allow_anonymous true 는 **로컬 개발 전용**이다.
#
# 운영(EC2)에서는 반드시 다음을 적용해야 한다.
#   1) allow_anonymous false
#   2) password_file /mosquitto/config/passwd 활성화
#   3) Security Group 에서 1883 을 0.0.0.0/0 으로 열지 말 것
#      (백엔드/ROS2 장비 IP 또는 VPC 내부로만 제한)
#
# 비밀번호 파일 생성 방법은 infra/mqtt/README.md 참고. 생성된 passwd 파일은
# .gitignore 로 Git 추적에서 제외돼 있다 — 저장소에 커밋하지 말 것.
allow_anonymous true
# password_file /mosquitto/config/passwd

# -----------------------------------------------------------------------------
# 영속성 — QoS 1 메시지가 브로커 재시작을 견디게 한다
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# -----------------------------------------------------------------------------
# 로그
# -----------------------------------------------------------------------------
# 연결/구독 로그를 남겨야 "백엔드가 실제로 붙었는지, 어떤 토픽을 QoS 몇으로
# 구독했는지"를 브로커 쪽에서도 교차 확인할 수 있다.
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# -----------------------------------------------------------------------------
# 기타
# -----------------------------------------------------------------------------
# 백엔드(inbound/outbound)와 ROS2 브리지가 서로 다른 clientId 를 쓰므로 중복 접속
# 문제는 없다. 같은 clientId 로 두 번 접속하면 먼저 붙은 쪽이 끊기므로,
# 새 클라이언트를 추가할 때는 clientId 를 반드시 새로 부여할 것.
max_keepalive 120
